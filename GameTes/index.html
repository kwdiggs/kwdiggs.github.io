<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="styles.css" />
    <title>Tes</title>
  </head>

	<body>
        <div class="container">
          <div class="game-table-container">
            <div class="game-table"></div>
            <div class="plus-three-build display-none"></div>
          </div>
          <div class="button-container display-none">
            <div class="hint">??</div>
            <div class="plus-three">+3</div>
          </div>
        </div>

        <dialog class="dialog">
          <div class="dialog-button">Play</div>
          <hr>
          <div class="dialog-button print-deck">Print Your Own Deck</div>
        </dialog>

        <dialog class="scoreboard">
          <div class="scoreboard-content">
            <div class="labels">
              <div class="time-label">Time:</div>
              <div class="score-label">Matches Found:</div>
              <div class="hint-label">Hints:</div>
              <div class="plus-three-label">Plus Threes:</div>
            </div>
            <div class="values">
              <div class="time-value"></div>
              <div class="score-value"></div>
              <div class="hint-value"></div>
              <div class="plus-three-value"></div>
            </div>
          </div>
        </dialog>

        <dialog class="refresh-dialog">
           <div class="refresh-icon">⟲</div>
        </dialog>
	</body>

	<script src="main.js" type="module"></script>
</html>
