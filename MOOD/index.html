<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>MOOD</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#4a2d5e,#160c1e);font-family:"Press Start 2P",monospace;color:#fff;overflow:hidden;user-select:none}
  #wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  #stage,#bar{flex:none;width:min(96vw,calc((100vh - 120px) * 1.6))}
  #stage{position:relative}
  #c{width:100%;height:auto;aspect-ratio:800/500;display:block;border-radius:14px;box-shadow:0 0 0 4px #ff8fb1,0 0 40px rgba(255,143,177,.35),0 24px 60px rgba(0,0,0,.6)}
  #mini{position:absolute;top:12px;right:12px;width:120px;height:120px;border-radius:10px;border:3px solid rgba(255,255,255,.7);box-shadow:0 4px 14px rgba(0,0,0,.5)}
  #toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(9px,1.4vw,14px);text-shadow:0 2px 0 #000,0 0 16px #ff8fb1;white-space:nowrap;transition:opacity .3s;pointer-events:none}
  #bar{margin-top:12px;height:76px;display:flex;align-items:center;gap:16px;padding:0 16px;box-sizing:border-box;background:linear-gradient(#4a2d66,#2a1838);border-radius:16px;box-shadow:0 0 0 3px #ffd166,0 8px 20px rgba(0,0,0,.5)}
  #face{width:56px;height:56px;border-radius:14px;flex:none;box-shadow:0 0 0 2px #ffd166}
  .stat{font-weight:900;font-size:11px;letter-spacing:.5px;text-shadow:0 2px 0 #000;white-space:nowrap}
  #meter{flex:1;height:18px;background:#1a0f24;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 6px #000;border:2px solid #0008}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#ff6b9a,#ffd166,#8be36b);box-shadow:0 0 12px #ffd166;transition:width .5s}
  #inv{width:56px;height:56px;border-radius:14px;flex:none;box-shadow:0 0 0 2px #ffd166}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="mini"></canvas>
    <div id="toast"></div>
  </div>
  <div id="bar">
    <canvas id="face" width="56" height="56"></canvas>
    <div class="stat" id="hap"></div>
    <div id="meter"><div id="fill"></div></div>
    <canvas id="inv" width="56" height="56" title="Inventory: golden key"></canvas>
    <div class="stat" id="cnd"></div>
  </div>
</div>

<script>
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 800, H = 500;

// ================= TUNING: change these numbers to change how the game plays and looks =================
// (Save the file and reload it in your browser. Nothing else needs editing.)
const TUNING = {
  // --- you
  fovDeg: 100,               // width of the 3D view in degrees: wider shows more of the room at once
  walkSpeed: 3,              // how fast you walk, tiles per second
  turnSpeed: 2.4,            // arrow-key turning speed
  mouseTurn: .003,           // mouse sensitivity, left and right
  mouseLook: .3,             // mouse sensitivity, up and down (the view levels itself again when the mouse stops)
  playerHearts: 5,           // your hearts in the boss fight
  // --- candy
  candyMinLevel12: 6,        // the least candy you start level 1 or level 2 with
  candyMinBoss: 14,          // the least candy you start the boss level with
  candyPerBox: 3,            // candy in each candy box
  bossCandyPerBox: 1,        // ammo in each candy box in the boss arena (peppermint rockets)
  trampolineLaunch: 6.39,    // how hard a trampoline throws you up: sqrt(24 * 1.7), so the jump peaks at the +5 peppermint
  trampolineBonus: 5,        // ammo for the high peppermint above a trampoline
  candySpeed: 11,            // how fast a thrown candy flies, tiles per second
  pepperSpeed: 4.5,          // how fast a peppermint rocket flies in the boss arena, tiles per second
  lollipopSize: 64,          // size of the lollipop's head, in pixels
  lollipopKick: 30,          // how far the lollipop kicks back when it fires, in pixels
  // --- people
  sadChaseSpeed: .9,         // how fast a sad person chases you
  sadChaseRange: 7,          // how close you must be (tiles) before a sad person chases you
  grandSpeed: 1.3,           // grandma's and grandpa's speed
  hugStun: 2.5,              // seconds you are frozen by a hug
  npcsPerFloor: 8,           // people on a floor in level 1 (needs at least 5)
  npcsPerFloorL2: 6,         // people on each floor in level 2 (needs at least 3 for the special people)
  mazeCells: 7,              // maze size: 7 makes a 15 by 15 map, 9 makes 19 by 19
  grandpaDescent: 3.4,       // seconds grandpa takes to parachute down
  // --- the boss
  bossHealth: 20,            // candy hits needed to win
  rainbowSpeed: [4, 4.6, 5],         // rainbow speed at full, middle and low boss health
  bossShotInterval: [1.9, 1.6, 1.4], // seconds between volleys at full, middle and low health
  rainbowMax: 56,            // most rainbows alive at once
  rainbowLife: 4.5,          // seconds a rainbow flies before it fades
  bossBoxRespawn: 5,         // seconds between candy boxes reappearing in the boss arena
  bossMinDist: 2.2,          // the closest the bear is drawn at full size, in tiles; nearer than this he stops growing, so he never fills the screen
  bossWallHeight: 2,         // wall height in the boss arena (whole numbers; 1 is normal)
  // --- looks and pacing
  graffitiPer100: 35,        // how many yellow wall faces out of a hundred carry graffiti
  endingHold: 9              // seconds the beach is shown before the white-out
};
// =========================================================================================================
cv.width = W; cv.height = H;   // the drawing surface is 800 x 500 pixels (this line was hidden inside the comment above)
const mc = document.getElementById('mini'), mctx = mc.getContext('2d'); mc.width = 120; mc.height = 120;
const fc = document.getElementById('face').getContext('2d');
const ic = document.getElementById('inv').getContext('2d');

const FOV = TUNING.fovDeg * Math.PI / 180, FOCAL = (W / 2) / Math.tan(FOV / 2);
// each screen column looks along a flat image plane, exactly like the sprite projection, so walls and sprites always agree
const COLCA = Array.from({ length: W }, (_, x) => Math.atan((x + .5 - W / 2) / FOCAL)), COLCOS = COLCA.map(Math.cos);
const wallH = () => levelNo === 3 ? Math.max(1, Math.round(TUNING.bossWallHeight)) : levelNo === 4 ? 3 : 1;   // the boss arena has double-height walls; the bot battle has triple-height walls   // the boss arena has double-height walls
let MAP = [], doorX = 0, doorY = 0;
// Super Mario style clouds: a blocky white cloud with a dark outline and a blue-tinted underside, drawn pixel by pixel.
const MARIO_CLOUD = [
  '.....XXXX.....',
  '...XXXXXXXX...',
  '..XXXXXXXXXX..',
  '.XXXXXXXXXXXX.',
  'XXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXX',
  '.XXXXXXXXXXXX.'
];
function drawMarioCloud(x, y, px) {
  const rows = MARIO_CLOUD;
  ctx.fillStyle = '#2b3a66';                                   // the outline, drawn a pixel larger
  rows.forEach((row, r) => [...row].forEach((c, col) => { if (c === 'X') ctx.fillRect(x + col * px - 1, y + r * px - 1, px + 2, px + 2); }));
  rows.forEach((row, r) => [...row].forEach((c, col) => {
    if (c !== 'X') return;
    ctx.fillStyle = r >= rows.length - 2 ? '#c9e4ff' : '#ffffff';   // the bottom two rows are shaded blue
    ctx.fillRect(x + col * px, y + r * px, px, px);
  }));
}

const PAL = ['#ff6b9a', '#ffd166', '#6bd4ff', '#8be36b', '#c39bff', '#ff9f5a'];
const FOG = '255,214,236';
const START = { x: 2.5, y: 2.5, a: 0 };
const NPC_POS = [[11,2],[6,3],[3,7],[10,6],[12,12],[3,13],[12,9],[8,14]];
const NPC_LOOK = [
  { shirt:'#6f8fbf', hair:'#3b2d52', style:0, skin:'#f1c49a' },
  { shirt:'#8a6fbf', hair:'#7a3b1e', style:1, skin:'#d9a57a' },
  { shirt:'#5fa8a0', hair:'#1e1e2e', style:2, skin:'#8d5a3b' },
  { shirt:'#9aa0c8', hair:'#c9a33b', style:1, skin:'#ffdcb8' },
  { shirt:'#7c95b8', hair:'#4b2a1c', style:0, skin:'#e8b58e' },
  { shirt:'#6e7fa8', hair:'#2b2b2b', style:2, skin:'#b97a52' },
  { shirt:'#8fb0cf', hair:'#a0522d', style:1, skin:'#f5c9a5' },
  { shirt:'#7a8fb0', hair:'#333a55', style:0, skin:'#c98e62' }
];
const PICK_POS = [[4,5],[14,4],[3,10],[9,11]];

// Procedural candy-stripe wall texture
const TEX = document.createElement('canvas'); TEX.width = 64; TEX.height = 64;
{
  const g = TEX.getContext('2d');
  for (let x = 0; x < 64; x++) { g.fillStyle = PAL[Math.floor(x / 8) % PAL.length]; g.fillRect(x, 0, 1, 64); }
  g.fillStyle = 'rgba(255,255,255,.55)';
  for (let x = 4; x < 64; x += 16) g.fillRect(x, 0, 2, 64);
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, 'rgba(255,255,255,.4)'); gr.addColorStop(.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.4)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, 2, 64); g.fillRect(62, 0, 2, 64);
}

const DOOR_TEX = document.createElement('canvas'); DOOR_TEX.width = 64; DOOR_TEX.height = 64;
{
  const g = DOOR_TEX.getContext('2d');
  // vertical wooden planks
  for (let x = 0; x < 64; x += 16) {
    g.fillStyle = (x / 16) % 2 ? '#8a5a2e' : '#7a4c25';
    g.fillRect(x, 0, 16, 64);
    g.fillStyle = '#4a2a14'; g.fillRect(x, 0, 2, 64);
  }
  // wood grain
  g.strokeStyle = 'rgba(40,20,8,.35)'; g.lineWidth = 1;
  for (let y = 4; y < 64; y += 9) { g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(20, y + 3, 40, y - 3, 64, y); g.stroke(); }
  // raised panels
  g.strokeStyle = '#3a200f'; g.lineWidth = 2;
  g.strokeRect(6, 8, 22, 22); g.strokeRect(36, 8, 22, 22);
  g.strokeRect(6, 36, 22, 20); g.strokeRect(36, 36, 22, 20);
  // frame top and bottom
  g.fillStyle = '#2e1a0c'; g.fillRect(0, 0, 64, 3); g.fillRect(0, 61, 64, 3);
  // iron strap across the middle with rivets
  g.fillStyle = '#3b3b44'; g.fillRect(0, 30, 64, 3);
  g.fillStyle = '#9aa3b5';
  for (let x = 4; x < 64; x += 12) { g.beginPath(); g.arc(x, 31.5, 1, 0, 7); g.fill(); }
  // iron hinges on the left edge
  g.fillStyle = '#2b2b33'; g.fillRect(0, 12, 6, 4); g.fillRect(0, 48, 6, 4);
  // brass knob
  g.fillStyle = '#2b2b33'; g.beginPath(); g.arc(52, 32, 4, 0, 7); g.fill();
  g.fillStyle = '#f0c85a'; g.beginPath(); g.arc(52, 32, 2.5, 0, 7); g.fill();
}

const TEX2 = document.createElement('canvas'); TEX2.width = 64; TEX2.height = 64;
{
  const g = TEX2.getContext('2d');
  const P2 = ['#7fb2ff', '#b18cff', '#6fe0ff', '#d6a6ff'];
  for (let x = 0; x < 64; x++) { g.fillStyle = P2[Math.floor(x / 16) % 4]; g.fillRect(x, 0, 1, 64); }
  g.fillStyle = 'rgba(255,255,255,.5)'; for (let x = 8; x < 64; x += 16) g.fillRect(x, 0, 2, 64);
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
}

function makeStripeTex(c1, c2) {                          // diagonal candy stripes, a different colour pair per theme
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = c2; g.fillRect(0, 0, 64, 64);
  g.save(); g.translate(32, 32); g.rotate(-Math.PI / 4);
  const P = 64 / 2 / Math.SQRT2;                             // stripe period chosen so the texture tiles seamlessly
  g.fillStyle = c1;
  for (let i = -8; i < 8; i++) g.fillRect(i * P, -100, P / 2, 200);
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.85)';                     // sugar sprinkles
  let sd = 11; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 16; i++) g.fillRect(r() * 62, r() * 62, 2, 2);
  const gl = g.createLinearGradient(0, 0, 0, 64);
  gl.addColorStop(0, 'rgba(255,255,255,.45)'); gl.addColorStop(.5, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(0,0,0,.4)');
  g.fillStyle = gl; g.fillRect(0, 0, 64, 64);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, 2, 64); g.fillRect(62, 0, 2, 64);
  return cv;
}
function paintGraffiti(g, kind) {                         // a little spray-painted candy doodle, drawn on a 64x64 wall tile
  const INKC = '#2a1a00', P = { pink: '#ff4f9a', cyan: '#2fc8ff', purple: '#8b4dff', green: '#43d17a', orange: '#ff8a2b', red: '#ff3b5c' };
  let sd = kind * 97 + 13; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  g.lineCap = 'round'; g.lineJoin = 'round';
  const ink = (path, fill, w) => { g.beginPath(); path(); g.fillStyle = fill; g.fill(); g.lineWidth = w || 2.2; g.strokeStyle = INKC; g.stroke(); };
  const drip = (x, y, len, col) => { g.strokeStyle = col; g.lineWidth = 1.8; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + len); g.stroke(); g.fillStyle = col; g.beginPath(); g.arc(x, y + len, 1.5, 0, 7); g.fill(); };
  const glint = (x, y, rx, ry) => { g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(x, y, rx, ry, -.6, 0, 7); g.fill(); };
  const spray = (cx, cy, rad, col, n) => { g.fillStyle = col; g.globalAlpha = .5; for (let i = 0; i < n; i++) { const a = r() * 6.28, d = rad * (.9 + r() * .7); g.fillRect(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 1.3, 1.3); } g.globalAlpha = 1; };
  const thick = (path, outline, fill, wo, wf) => { g.beginPath(); path(); g.strokeStyle = outline; g.lineWidth = wo; g.stroke(); g.beginPath(); path(); g.strokeStyle = fill; g.lineWidth = wf; g.stroke(); };
  if (kind === 1) {                                        // lollipop
    ink(() => g.roundRect(29, 38, 4, 20, 2), '#ffffff', 1.8);
    ink(() => g.arc(31, 25, 14, 0, 7), P.pink);
    g.strokeStyle = '#ffffff'; g.lineWidth = 2.2; g.beginPath();
    for (let a = 0; a < 4 * Math.PI; a += .25) { const rr = 1.5 + a * .85, x = 31 + Math.cos(a) * rr, y = 25 + Math.sin(a) * rr; if (a === 0) g.moveTo(x, y); else g.lineTo(x, y); }
    g.stroke(); glint(25, 18, 3, 1.6); drip(37, 38, 7, P.pink); spray(31, 25, 15, P.pink, 14);
  } else if (kind === 2) {                                 // wrapped candy
    for (const s of [-1, 1]) ink(() => { g.moveTo(32 + s * 11, 34); g.lineTo(32 + s * 22, 25); g.lineTo(32 + s * 20, 34); g.lineTo(32 + s * 22, 43); g.closePath(); }, '#ffffff', 1.8);
    ink(() => g.ellipse(32, 34, 13, 9, 0, 0, 7), P.cyan);
    g.strokeStyle = '#ffffff'; g.lineWidth = 2.4; for (const dx of [-6, 0, 6]) { g.beginPath(); g.moveTo(32 + dx - 3, 28); g.lineTo(32 + dx + 3, 40); g.stroke(); }
    glint(26, 30, 3, 1.5); drip(22, 41, 8, P.cyan); spray(32, 34, 17, P.cyan, 14);
  } else if (kind === 3) {                                 // ice cream cone
    ink(() => { g.moveTo(21, 32); g.lineTo(43, 32); g.lineTo(32, 58); g.closePath(); }, '#e8a050');
    g.strokeStyle = 'rgba(120,60,0,.6)'; g.lineWidth = 1.1;
    for (const [x0, y0, x1, y1] of [[24, 36, 36, 50], [28, 34, 40, 44], [40, 36, 28, 50], [36, 34, 26, 44]]) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
    ink(() => { g.arc(32, 27, 12, Math.PI, 0); g.lineTo(44, 31); g.quadraticCurveTo(41, 37, 38, 31); g.quadraticCurveTo(34, 38, 30, 31); g.quadraticCurveTo(26, 36, 22, 31); g.closePath(); }, P.pink);
    ink(() => g.arc(33, 13, 3.4, 0, 7), P.red, 1.6); glint(25, 22, 3, 1.6); spray(32, 30, 18, P.pink, 14);
  } else if (kind === 4) {                                 // cupcake
    ink(() => { g.moveTo(20, 39); g.lineTo(44, 39); g.lineTo(40, 57); g.lineTo(24, 57); g.closePath(); }, P.purple);
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.4; for (const x of [26, 32, 38]) { g.beginPath(); g.moveTo(x, 41); g.lineTo(x - (x - 32) * .1, 55); g.stroke(); }
    ink(() => g.ellipse(32, 36, 14, 6, 0, 0, 7), '#ff8fc0'); ink(() => g.ellipse(32, 29, 11, 5.5, 0, 0, 7), '#ff8fc0'); ink(() => g.ellipse(32, 23, 7, 4.5, 0, 0, 7), '#ff8fc0');
    ink(() => g.arc(32, 17, 3.2, 0, 7), P.red, 1.5);
    for (const [x, y, c] of [[26, 35, P.cyan], [37, 36, P.green], [30, 29, P.orange], [35, 28, '#ffffff']]) { g.fillStyle = c; g.fillRect(x, y, 2.4, 1.4); }
    glint(27, 22, 2.5, 1.2); spray(32, 32, 17, P.purple, 12);
  } else if (kind === 5) {                                 // a bubble-letter YUM! tag
    g.save(); g.translate(29, 35); g.rotate(-.1); g.translate(-32, -35);
    const yum = () => {
      g.moveTo(11, 26); g.lineTo(16, 34); g.lineTo(21, 26); g.moveTo(16, 34); g.lineTo(16, 43);
      g.moveTo(26, 26); g.lineTo(26, 38); g.quadraticCurveTo(26, 43, 31, 43); g.quadraticCurveTo(36, 43, 36, 38); g.lineTo(36, 26);
      g.moveTo(40, 43); g.lineTo(40, 26); g.lineTo(46, 36); g.lineTo(52, 26); g.lineTo(52, 43);
      g.moveTo(57, 26); g.lineTo(57, 36); g.moveTo(57, 43); g.lineTo(57, 43.2);
    };
    thick(yum, INKC, P.pink, 7, 3.8); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1; g.beginPath(); g.moveTo(26, 28); g.lineTo(26, 35); g.moveTo(40, 28); g.lineTo(40, 36); g.stroke();
    drip(16, 45, 8, P.pink); drip(31, 46, 5, P.pink); drip(52, 45, 7, P.pink); spray(34, 35, 24, P.pink, 16);
    g.restore();
  } else if (kind === 6) {                                 // a heart with sparkles
    ink(() => { g.moveTo(32, 50); g.bezierCurveTo(8, 34, 16, 12, 32, 25); g.bezierCurveTo(48, 12, 56, 34, 32, 50); }, P.red);
    glint(23, 26, 4, 2); drip(32, 50, 7, P.red); spray(32, 34, 20, P.red, 14);
    for (const [x, y, c] of [[12, 16, P.cyan], [53, 14, P.green], [50, 50, P.purple]]) { g.fillStyle = c; g.beginPath(); g.moveTo(x, y - 5); g.quadraticCurveTo(x, y, x + 5, y); g.quadraticCurveTo(x, y, x, y + 5); g.quadraticCurveTo(x, y, x - 5, y); g.quadraticCurveTo(x, y, x, y - 5); g.fill(); g.lineWidth = 1.3; g.strokeStyle = INKC; g.stroke(); }
  } else if (kind === 7) {                                 // candy cane
    const cane = () => { g.moveTo(38, 59); g.lineTo(38, 28); g.arc(30, 28, 8, 0, Math.PI, true); g.lineTo(22, 33); };
    thick(cane, INKC, '#ffffff', 10, 6.4);
    g.strokeStyle = P.red; g.lineWidth = 2.8; for (const y of [54, 46, 38, 31]) { g.beginPath(); g.moveTo(34.5, y + 3); g.lineTo(41.5, y - 3); g.stroke(); }
    g.beginPath(); g.moveTo(24, 22.5); g.lineTo(28, 20.2); g.stroke(); g.beginPath(); g.moveTo(34, 21); g.lineTo(37, 25); g.stroke();
    drip(22, 34, 8, P.red); spray(30, 38, 20, P.red, 12);
  } else if (kind === 8) {                                 // a star burst
    ink(() => { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? 9 : 21; const x = 32 + Math.cos(a) * rad, y = 32 + Math.sin(a) * rad; if (i) g.lineTo(x, y); else g.moveTo(x, y); } g.closePath(); }, P.orange);
    glint(28, 26, 3, 1.5); spray(32, 32, 24, P.orange, 14);
  } else if (kind === 9) {                                 // a gumdrop with sugar sparkles
    ink(() => { g.moveTo(14, 46); g.bezierCurveTo(12, 18, 52, 18, 50, 46); g.closePath(); }, P.purple);
    glint(26, 28, 4, 2.2); for (const [x, y] of [[24, 38], [34, 30], [41, 40], [30, 44]]) { g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill(); }
    spray(32, 36, 22, P.purple, 10);
  } else if (kind === 10) {                                // a round wrapped red candy, turned 25 degrees
    g.save(); g.translate(32, 32); g.rotate(25 * Math.PI / 180);

function generateMap(cells) {
  const N = cells * 2 + 1;
  const g = Array.from({ length: N }, () => Array(N).fill('1'));
  g[1][1] = '0';
  const stack = [[1, 1]];
  const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = dirs.filter(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx > 0 && ny > 0 && nx < N - 1 && ny < N - 1 && g[ny][nx] === '1';
    });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(Math.random() * opts.length)];
    g[y + dy / 2][x + dx / 2] = '0';
    g[y + dy][x + dx] = '0';
    stack.push([x + dx, y + dy]);
  }
  // open the map up: knock out many interior walls and carve a few open rooms
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    if (g[y][x] === '1' && Math.random() < .45) g[y][x] = '0';
  }
  for (let r = 0; r < 4; r++) {
    const cx = 2 + Math.floor(Math.random() * (N - 5)), cy = 2 + Math.floor(Math.random() * (N - 5));
    for (let y = cy; y < cy + 3; y++) for (let x = cx; x < cx + 3; x++) g[y][x] = '0';
  }
  // locked door on the outer wall, reached from the corridor just inside it
  const xs = [];
  for (let x = 1; x < N - 1; x += 2) if (g[N - 2][x] === '0') xs.push(x);
  doorX = xs[Math.floor(xs.length / 2)];
  doorY = N - 1;

  if (doorX < N - 2) g[N - 2][doorX + 1] = '0';

    if (b.look.walking) { b.look.walkT = (b.look.walkT || 0) + dt; if (b.look.walkT >= .22) { b.look.walkT -= .22; b.look.walkStep = ((b.look.walkStep || 0) + 1) & 3; } }
    b.shootT -= dt;
    if (b.shootT <= 0 && d < 8 && bossLineClear(b.x, b.y, player.x, player.y)) {
      b.shootT = 1.4 + Math.random() * 1.2;
      const a = Math.atan2(dy, dx) + (Math.random() - .5) * .12, sp = 4;
      botShots.push({ x: b.x + Math.cos(a) * .5, y: b.y + Math.sin(a) * .5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, alive: true, spin: 0 });
      sfx([[300, .08, 'triangle']]);
    }
  }
  for (const sh of botShots) {                                      // the bots' candy
    sh.life += dt; sh.spin += dt * 10;
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    if (isWall(sh.x, sh.y) || sh.life > 6) { sh.alive = false; continue; }
    if (Math.hypot(sh.x - player.x, sh.y - player.y) < .4) {
      sh.alive = false; player.hp--; shake = .3;
      say(`Hit! ${Math.max(0, player.hp)} hearts left.`); sfx([[120, .2, 'sawtooth']]);
      if (player.hp <= 0) { state = 'lose'; loseMsg = ''; return; }
    }
  }
  botShots = botShots.filter(sh => sh.alive);
  for (const hk of healthPacks) {                                   // rare health packs, back after a while
    if (!hk.alive) { hk.respawn -= dt; if (hk.respawn <= 0) { placeHealth(hk); hk.alive = true; } continue; }
    if (Math.hypot(hk.x - player.x, hk.y - player.y) < .7 && player.hp < TUNING.playerHearts) {

      say('Health pack! +1 heart.'); sfx([[660, .1, 'triangle'], [990, .2, 'triangle', .08]]);
    }
  }
}

// Conveyors are part of the floor: they are drawn before the walls, so walls cover them naturally.
function drawBelt(it, pr) {
  // a factory conveyor: a steel bed with rollers that turn along the belt, clipped to what is in front of the camera
  const bx = it.s.x, by = it.s.y, bd = beltDir(Math.floor(bx), Math.floor(by));
  if (bd) {
    const pdx = -bd[1], pdy = bd[0];                                   // across the belt
    const P = (al, pe) => beltView(bx + bd[0] * al + pdx * pe, by + bd[1] * al + pdy * pe);
    const quad = clipBelt([P(-.5, -.5), P(.5, -.5), P(.5, .5), P(-.5, .5)]);
    if (quad.length >= 3) {
      ctx.beginPath(); quad.forEach((v, i) => { const q = beltScreen(v); if (i) ctx.lineTo(q.sx, q.feet); else ctx.moveTo(q.sx, q.feet); }); ctx.closePath();
      ctx.fillStyle = '#3b4456'; ctx.fill();                           // the steel bed
    }
    const segOf = (A, B) => { const c = clipBeltSeg(A, B); return c ? [beltScreen(c[0]), beltScreen(c[1])] : null; };
    const off = (t * .9) % 1, rw = Math.max(1.5, pr.u * .3);
    const band = (a0, a1, col) => {                                  // a flat patch on the belt surface, so it follows the floor's perspective
      const q = clipBelt([P(a0, -.5), P(a0, .5), P(a1, .5), P(a1, -.5)]);
      if (q.length < 3) return;
      ctx.beginPath(); q.forEach((v, i) => { const sc = beltScreen(v); if (i) ctx.lineTo(sc.sx, sc.feet); else ctx.moveTo(sc.sx, sc.feet); }); ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
    };
    for (let k = 0; k < 3; k++) {                                      // the rollers, rolling along the belt
      const al = ((k + off) % 1) - .5;
      band(al - .09, al + .09, '#1d2330');
      band(al - .04, al + .04, '#b4bdd0');
    }
  }
}

let msgFlash = false;   // the message that is flashing, to draw attention to it
function say(s, flash = false) { msgText = s; msgT = 2.5; msgFlash = flash; }

function sfx(notes) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const now = AC.currentTime;
    for (const [f, d, type, del] of notes) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'triangle'; o.frequency.value = f;
      const s = now + (del || 0);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.12, s + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(AC.destination);
      o.start(s); o.stop(s + d + 0.02);
    }
  } catch (e) {}
}

const cellAt = (x, y) => { const row = MAP[Math.floor(y)]; return row ? (row[Math.floor(x)] ?? '1') : '1'; };
const isWall = (x, y) => cellAt(x, y) === '1' || cellAt(x, y) === '2';
function blocked(x, y, m = .25) {
  return isWall(x - m, y - m) || isWall(x + m, y - m) || isWall(x - m, y + m) || isWall(x + m, y + m);
}
function norm(a) {
  while (a > Math.PI) a -= 2 * Math.PI;
  while (a < -Math.PI) a += 2 * Math.PI;
  return a;
}

function castRay(a) {
  const dx = Math.cos(a), dy = Math.sin(a);
  let mx = Math.floor(player.x), my = Math.floor(player.y);
  const ddx = Math.abs(1 / dx), ddy = Math.abs(1 / dy);
  let sx, sy, sdx, sdy;
  if (dx < 0) { sx = -1; sdx = (player.x - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - player.x) * ddx; }
  if (dy < 0) { sy = -1; sdy = (player.y - my) * ddy; } else { sy = 1; sdy = (my + 1 - player.y) * ddy; }
  let side = 0, hit = false;
  while (!hit) {
    if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; }
    else { sdy += ddy; my += sy; side = 1; }
    const hc = cellAt(mx + .5, my + .5);
    if (hc === '1' || hc === '2') hit = true;
  }
  const dist = side === 0 ? (mx - player.x + (1 - sx) / 2) / dx : (my - player.y + (1 - sy) / 2) / dy;
  return { dist: Math.abs(dist), side, mx, my, door: cellAt(mx + .5, my + .5) === '2' };
}

// Project a world point to screen. Returns null if not visible.
function project(s, wide) {
  const dx = s.x - player.x, dy = s.y - player.y, d = Math.hypot(dx, dy);
  const rel = norm(Math.atan2(dy, dx) - player.a);
  if (Math.abs(rel) > (wide ? 1.35 : FOV / 2 + .25)) return null;
  const perp = d * Math.cos(rel);
  if (perp < .3) return null;
  const sx = W / 2 + Math.tan(rel) * FOCAL;
  return { sx, perp, rel, d, u: FOCAL / perp / 14, feet: H / 2 + FOCAL * EYE / perp, col: Math.max(0, Math.min(W - 1, Math.round(sx))) };
}

const INK = '#1d1428';
const lwFor = u => Math.min(6, Math.max(1.2, .3 * u));
const _dk = {};
function dk(hex, a) {                                       // a darker tone with a cool purple tint, for cel shadows
  a = a === undefined ? .3 : a;
  const key = hex + '|' + a;
  if (_dk[key]) return _dk[key];
  if (typeof hex !== 'string' || hex[0] !== '#' || hex.length !== 7) return hex;
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const f = (c, tint) => Math.max(0, Math.min(255, Math.round(c * (1 - a) + tint * a)));
  return _dk[key] = '#' + [f(r, 60), f(g, 30), f(b, 90)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function lt(hex, a) {                                       // a lighter tone, for highlights
  a = a === undefined ? .35 : a;
  const key = hex + '|l' + a;
  if (_dk[key]) return _dk[key];
  if (typeof hex !== 'string' || hex[0] !== '#' || hex.length !== 7) return hex;
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const f = c => Math.max(0, Math.min(255, Math.round(c * (1 - a) + 255 * a)));
  return _dk[key] = '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
// Cel-shaded part: flat base tone, a hard-edged shadow crescent on the lower right, then a thick ink outline.
function cel(u, path, base, shade, L) {
  L = L || ctx;
  if (shade && u >= 2.2) {
    const d = Math.max(.8, .45 * u);
    L.save(); L.beginPath(); path(); L.clip();
    L.fillStyle = shade; L.beginPath(); path(); L.fill();
    L.translate(-d, -d * .85); L.fillStyle = base; L.beginPath(); path(); L.fill();
    L.restore();
  } else { L.fillStyle = base; L.beginPath(); path(); L.fill(); }
  L.beginPath(); path(); L.lineWidth = lwFor(u); L.strokeStyle = INK; L.lineJoin = 'round'; L.lineCap = 'round'; L.stroke();
}
function shine(L, x, y, rx, ry, rot, a) {                  // a small glossy highlight
  L.save(); L.globalAlpha *= (a === undefined ? .65 : a); L.fillStyle = '#fff';
  L.beginPath(); L.ellipse(x, y, rx, ry, rot || 0, 0, 7); L.fill(); L.restore();
}
function capsule(L, x0, y0, x1, y1, w) {
  const a = Math.atan2(y1 - y0, x1 - x0), r = w / 2;
  L.arc(x0, y0, r, a + Math.PI / 2, a + Math.PI * 1.5);
  L.arc(x1, y1, r, a - Math.PI / 2, a + Math.PI / 2);
  L.closePath();
}
function heartPath(L, x, y, s) {
  L.moveTo(x, y + s * .55);
  L.bezierCurveTo(x + s * 1.2, y - s * .3, x + s * .55, y - s * 1.2, x, y - s * .45);
  L.bezierCurveTo(x - s * .55, y - s * 1.2, x - s * 1.2, y - s * .3, x, y + s * .55);
  L.closePath();
}
function shieldPath(L, x, y, w, h) {                        // a small badge shield, top-left at (x, y)
  L.moveTo(x, y); L.lineTo(x + w, y); L.lineTo(x + w, y + h * .6);
  L.quadraticCurveTo(x + w * .5, y + h * 1.1, x, y + h * .6); L.closePath();
}

function bossArmLift(T) {                                  // the cutscene: four smooth arm raises while he speaks, the last one finished before the camera pulls back
  for (const s of [1.3, 1.78, 2.26, 2.74]) if (T > s && T < s + .42) return Math.pow(Math.sin(Math.PI * (T - s) / .42), 2);
  return 0;
}

function drawFlatShuriken(x, y, r, spin, a) {              // a shuriken spinning flat, seen almost edge-on because it is thrown horizontally
  const L = ctx; L.save(); L.globalAlpha *= a; L.translate(x, y); L.scale(1, .4); drawShuriken(0, 0, r, spin); L.restore();
}

function drawPlayerBack(cx, feet, u, look) {                  // the player seen from behind: red jacket, a half-blue half-red pill capsule on the back, looking out to sea
  // look (optional) recolours a second beachgoer: jacket, hair, shoes, sole, and the two halves of the pill
  const o = look || {}, L = ctx, breathe = Math.sin(t * 1.6) * .1 * u, sway = Math.sin(t * .9) * .12 * u;
  const RED = o.jacket || '#d9262f', JEANS = '#3b4a7c', HAIR = o.hair || '#6b4226', SKIN = '#f4c19b';

// ---------- drawing primitives ----------
function drawCandy(cx, cy, r) {                            // a wrapped candy: swirled centre with twisted wrapper ends
  const L = ctx, lw = Math.max(1, Math.min(5, r * .14));
  L.lineJoin = 'round'; L.lineCap = 'round';
  for (const sd of [-1, 1]) {                                // wrapper twists
    L.beginPath(); L.moveTo(cx + sd * r * .8, cy); L.lineTo(cx + sd * r * 1.75, cy - r * .62); L.lineTo(cx + sd * r * 1.55, cy); L.lineTo(cx + sd * r * 1.75, cy + r * .62); L.closePath();
    L.fillStyle = 'rgba(255,255,255,.85)'; L.fill(); L.lineWidth = lw; L.strokeStyle = INK; L.stroke();
  }
  for (let i = 0; i < 6; i++) {
    L.fillStyle = PAL[i];
    L.beginPath(); L.moveTo(cx, cy); L.arc(cx, cy, r, i * Math.PI / 3, (i + 1) * Math.PI / 3); L.closePath(); L.fill();
  }
  L.lineWidth = lw; L.strokeStyle = INK;
  L.beginPath(); L.arc(cx, cy, r, 0, Math.PI * 2); L.stroke();
  L.lineWidth = lw * .55;
  for (let i = 0; i < 6; i++) { L.beginPath(); L.moveTo(cx, cy); L.lineTo(cx + Math.cos(i * Math.PI / 3) * r, cy + Math.sin(i * Math.PI / 3) * r); L.stroke(); }
  shine(L, cx - r * .38, cy - r * .42, r * .27, r * .14, -.6, .75);
}

function drawWrappedPeppermint(cx, cy, r) {               // a peppermint in a twisted wrapper, for the boss arena's ammo
  const L = ctx, lw = Math.max(1, Math.min(5, r * .14));
  L.lineJoin = 'round'; L.lineCap = 'round';
  for (const sd of [-1, 1]) {                                // wrapper twists
    L.beginPath(); L.moveTo(cx + sd * r * .8, cy); L.lineTo(cx + sd * r * 1.75, cy - r * .62); L.lineTo(cx + sd * r * 1.55, cy); L.lineTo(cx + sd * r * 1.75, cy + r * .62); L.closePath();
    L.fillStyle = 'rgba(255,255,255,.9)'; L.fill(); L.lineWidth = lw; L.strokeStyle = INK; L.stroke();
    L.beginPath(); L.moveTo(cx + sd * r * 1.2, cy - r * .3); L.lineTo(cx + sd * r * 1.6, cy); L.lineTo(cx + sd * r * 1.2, cy + r * .3);
    L.strokeStyle = '#ff3d5a'; L.lineWidth = lw * .8; L.stroke();
  }
  for (let i = 0; i < 8; i++) {                              // red and white peppermint wedges
    L.fillStyle = i % 2 ? '#ffffff' : '#ff3d5a';
    L.beginPath(); L.moveTo(cx, cy); L.arc(cx, cy, r, i * Math.PI / 4, (i + 1) * Math.PI / 4); L.closePath(); L.fill();
  }
  L.lineWidth = lw; L.strokeStyle = INK;
  L.beginPath(); L.arc(cx, cy, r, 0, Math.PI * 2); L.stroke();
  shine(L, cx - r * .38, cy - r * .42, r * .27, r * .14, -.6, .75);
}

function star(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}

function drawPerson(cx, feet, u, p, happy) {
  const L = ctx, role = p.role || null, full = u >= 2.2;
  const walkOn = !!p.walking, ph = walkOn ? (Math.floor(t / .22 + (p.ph || 0) * 2.3) & 3) : 0;   // each person's own clock   // stop-motion stride: four poses, stepping a few times a second while they move
  // walk keyframes: contact poses plant one leg forward and the other back; passing poses bring the legs under the body
  const walkF = sd => walkOn ? (sd > 0 ? [1, 0, -1, 0] : [-1, 0, 1, 0])[ph] : 0;   // +1 planted forward, -1 planted back, 0 passing
  const walkLift = sd => walkOn && walkF(sd) === 0 && ((sd < 0) === (ph === 1));   // the leg swinging through is lifted
  const walkBob = walkOn && (ph & 1) ? .35 * u : 0;                              // the body rises on passing poses and dips on contact
  const bobY = happy ? Math.abs(Math.sin(t * 5 + p.ph)) * u * 1.3 : Math.sin(t * 2 + p.ph) * u * .2;
  cx += happy ? Math.sin(t * 4 + p.ph) * u * .9 : Math.sin(t * 1.3 + p.ph) * u * .3;
  const y = feet - bobY + (happy ? 0 : u * .8) - walkBob;
  const skin = p.skin, skinD = dk(skin, .32);
  const C = ({
    police:  { top: '#2c4a8a', pants: '#1f2f5a', shoes: '#15151d', hand: skin },
    fire:    { top: '#f2b824', pants: '#2b2f3d', shoes: '#15151d', hand: '#2b2f3d' },
    builder: { top: '#5f7fa8', pants: '#3e5a86', shoes: '#6b4a2a', hand: '#d9a85a' },
    doctor:  { top: '#f6f8fc', pants: '#4fb0d4', shoes: '#e8ecf4', hand: skin }
  })[role] || { top: p.shirt, pants: '#3b2d52', shoes: '#2b2236', hand: skin };
  L.save(); L.lineCap = 'round'; L.lineJoin = 'round';

  L.fillStyle = 'rgba(0,0,0,.28)';                                                   // ground shadow
  L.beginPath(); L.ellipse(cx, feet + .4 * u, 4.2 * u, 1.1 * u, 0, 0, 7); L.fill();

  if (p.style === 1 && !role) cel(u, () => L.roundRect(cx - 3.9 * u, y - 12.6 * u, 7.8 * u, 7.8 * u, 2.6 * u), p.hair, dk(p.hair));   // long hair behind

  for (const sd of [-1, 1]) {                                                         // legs and shoes, with depth from the walk pose
    const f = walkF(sd), sc = f > 0 ? 1.12 : f < 0 ? .9 : 1, fy = (f > 0 ? .4 : f < 0 ? -.35 : 0) * u - (walkLift(sd) ? .7 * u : 0);
    cel(u, () => L.roundRect(cx + sd * 1.7 * u - 1.1 * u * sc, y + fy - 2.8 * u * sc, 2.2 * u * sc, 2.8 * u * sc, .8 * u * sc), C.pants, dk(C.pants));
    cel(u, () => L.ellipse(cx + sd * 1.85 * u, y + fy - .5 * u * sc, 1.5 * u * sc, .85 * u * sc, 0, 0, 7), C.shoes, dk(C.shoes, .45));
  }
  if (full && role === 'police') for (const sd of [-1, 1]) {                          // trouser stripe
    L.strokeStyle = '#e8c04a'; L.lineWidth = Math.max(1, .3 * u); L.beginPath(); L.moveTo(cx + sd * 2.6 * u, y - 2.6 * u); L.lineTo(cx + sd * 2.6 * u, y - .9 * u); L.stroke();
  }

  cel(u, () => L.roundRect(cx - 3.5 * u, y - 6.8 * u, 7 * u, 5.8 * u, 1.8 * u), C.top, dk(C.top));   // torso

  if (full) {
    if (role === 'police') {
      for (const sd of [-1, 1]) cel(u, () => L.roundRect(cx + sd * 2.6 * u - .8 * u, y - 7 * u, 1.6 * u, .75 * u, .3 * u), '#e8c04a', dk('#e8c04a'));   // epaulettes
      cel(u, () => { L.moveTo(cx - .4 * u, y - 6.6 * u); L.lineTo(cx + .4 * u, y - 6.6 * u); L.lineTo(cx + .6 * u, y - 3.9 * u); L.lineTo(cx, y - 3.3 * u); L.lineTo(cx - .6 * u, y - 3.9 * u); L.closePath(); }, '#16161e', null);   // tie
      for (const sd of [-1, 1]) cel(u, () => { L.moveTo(cx + sd * .4 * u, y - 6.9 * u); L.lineTo(cx + sd * 1.9 * u, y - 6.9 * u); L.lineTo(cx + sd * .9 * u, y - 5.2 * u); L.closePath(); }, '#e9edf7', dk('#e9edf7'));   // collar
      cel(u, () => shieldPath(L, cx + 1.1 * u, y - 5.8 * u, 1.5 * u, 1.5 * u), '#e8c04a', dk('#e8c04a'));   // badge
      for (const by of [4.9, 3.9]) { L.fillStyle = '#e8c04a'; L.beginPath(); L.arc(cx - 1.5 * u, y - by * u, .42 * u, 0, 7); L.fill(); L.lineWidth = lwFor(u) * .6; L.strokeStyle = INK; L.stroke(); }
      cel(u, () => L.roundRect(cx - 3.5 * u, y - 2.7 * u, 7 * u, 1.05 * u, .4 * u), '#16161e', null);      // belt
      cel(u, () => L.roundRect(cx - .75 * u, y - 2.8 * u, 1.5 * u, 1.25 * u, .3 * u), '#e8c04a', dk('#e8c04a'));
    } else if (role === 'fire') {
      cel(u, () => L.roundRect(cx - 2.3 * u, y - 7.2 * u, 4.6 * u, 1.3 * u, .6 * u), '#2b2f3d', null);       // collar
      L.strokeStyle = INK; L.lineWidth = lwFor(u) * .8; L.beginPath(); L.moveTo(cx, y - 5.9 * u); L.lineTo(cx, y - 1.1 * u); L.stroke();   // front seam
      for (const by of [4.9, 3.3]) cel(u, () => L.roundRect(cx - 3.45 * u, y - by * u, 6.9 * u, .7 * u, .2 * u), '#e9eef5', '#a9b3c8');   // reflective bands
      for (const by of [5.5, 2.2]) for (const sd of [-1, 1]) { L.fillStyle = '#2b2f3d'; L.beginPath(); L.arc(cx + sd * .9 * u, y - by * u, .35 * u, 0, 7); L.fill(); }
    } else if (role === 'builder') {
      for (const sd of [-1, 1]) {                                                                              // orange vest, two panels
        cel(u, () => { L.moveTo(cx + sd * 3.4 * u, y - 6.7 * u); L.lineTo(cx + sd * 1.0 * u, y - 6.7 * u); L.lineTo(cx + sd * .55 * u, y - 1.1 * u); L.lineTo(cx + sd * 3.4 * u, y - 1.1 * u); L.closePath(); }, '#ff7a14', '#c4560a');
        cel(u, () => L.rect(cx + sd * 2.3 * u - .3 * u, y - 6.6 * u, .6 * u, 5.4 * u), '#eef2f5', '#b3bccb');   // reflective stripes
      }
      cel(u, () => L.rect(cx - 3.4 * u, y - 3.6 * u, 6.8 * u, .6 * u), '#eef2f5', '#b3bccb');
    } else if (role === 'doctor') {
      cel(u, () => { L.moveTo(cx - 1.5 * u, y - 6.8 * u); L.lineTo(cx + 1.5 * u, y - 6.8 * u); L.lineTo(cx, y - 4.4 * u); L.closePath(); }, '#4fb0d4', dk('#4fb0d4'));   // scrubs V-neck
      L.strokeStyle = INK; L.lineWidth = lwFor(u) * .8; L.beginPath(); L.moveTo(cx, y - 4.4 * u); L.lineTo(cx, y - 1.1 * u); L.stroke();
      for (const sd of [-1, 1]) cel(u, () => { L.moveTo(cx + sd * 1.5 * u, y - 6.9 * u); L.lineTo(cx + sd * 2.7 * u, y - 6.9 * u); L.lineTo(cx + sd * .3 * u, y - 4.3 * u); L.closePath(); }, '#fdfdff', '#c7cee0');   // lapels
      cel(u, () => L.roundRect(cx - 3.0 * u, y - 4.3 * u, 1.7 * u, 1.5 * u, .3 * u), '#eef1f8', '#c7cee0');     // pocket
      L.strokeStyle = '#3b6ad6'; L.lineWidth = Math.max(1, .4 * u); L.beginPath(); L.moveTo(cx - 2.4 * u, y - 4.3 * u); L.lineTo(cx - 2.4 * u, y - 5.1 * u); L.stroke();   // pen
      cel(u, () => L.roundRect(cx + 1.5 * u, y - 4.9 * u, 1.5 * u, .85 * u, .15 * u), '#ffffff', null);          // name tag
      L.fillStyle = '#4fb0d4'; L.fillRect(cx + 1.5 * u, y - 4.9 * u, .45 * u, .85 * u);
      for (const [w, col] of [[Math.max(2, .95 * u), INK], [Math.max(1, .5 * u), '#5a6380']]) {                // stethoscope tube
        L.strokeStyle = col; L.lineWidth = w;
        L.beginPath(); L.moveTo(cx - 1.7 * u, y - 6.7 * u); L.bezierCurveTo(cx - 2.6 * u, y - 3.2 * u, cx + .6 * u, y - 2.9 * u, cx + 1.1 * u, y - 3.7 * u); L.stroke();
        L.beginPath(); L.moveTo(cx + 1.7 * u, y - 6.7 * u); L.bezierCurveTo(cx + 2.8 * u, y - 4.4 * u, cx + 1.9 * u, y - 3.5 * u, cx + 1.1 * u, y - 3.7 * u); L.stroke();
      }
      cel(u, () => L.arc(cx + 1.1 * u, y - 3.5 * u, .7 * u, 0, 7), '#d8dfea', '#98a3ba');                          // chest piece
    } else {
      for (const sd of [-1, 1]) cel(u, () => { L.moveTo(cx + sd * .3 * u, y - 6.9 * u); L.lineTo(cx + sd * 1.8 * u, y - 6.9 * u); L.lineTo(cx + sd * .9 * u, y - 5.3 * u); L.closePath(); }, lt(C.top, .3), C.top);   // collar
      for (const by of [4.4, 3.2]) { L.fillStyle = dk(C.top, .45); L.beginPath(); L.arc(cx, y - by * u, .3 * u, 0, 7); L.fill(); }
    }
  }

  const arm = sd => {                                                                  // arms and hands
    const sx = cx + sd * 3.2 * u, sy = y - 5.4 * u;
    const ex = happy ? cx + sd * 5.7 * u : cx + sd * 4.3 * u, ey = (happy ? y - 9.8 * u : y - 1.9 * u) + walkF(-sd) * .45 * u;
    cel(u, () => capsule(L, sx, sy, ex, ey, 1.9 * u), C.top, dk(C.top));
    cel(u, () => L.arc(ex, ey, .95 * u, 0, 7), C.hand, dk(C.hand));
  };
  arm(-1); arm(1);

  for (const sd of [-1, 1]) cel(u, () => L.ellipse(cx + sd * 3.15 * u, y - 8.8 * u, .8 * u, .95 * u, 0, 0, 7), skin, skinD);   // ears
  cel(u, () => L.arc(cx, y - 9 * u, 3.2 * u, 0, 7), skin, skinD);                                                                // head
  if (full) shine(L, cx - 1.3 * u, y - 10.6 * u, .55 * u, .3 * u, -.6, .35);

  if (full) {                                                                          // face
    const ey = y - 9.1 * u;
    L.lineCap = 'round';

      L.save(); L.beginPath(); L.ellipse(cx, y - 7.5 * u, 1.45 * u, 1.3 * u, 0, 0, Math.PI); L.clip();
      L.fillStyle = '#ff8fa8'; L.beginPath(); L.ellipse(cx, y - 6.3 * u, 1.1 * u, .8 * u, 0, 0, 7); L.fill(); L.restore();   // tongue

        L.fillStyle = p.eye || '#3a2a5a'; L.beginPath(); L.arc(ex - sd * .05 * u, ey + .15 * u, .72 * u, 0, 7); L.fill();

        L.fillStyle = '#fff'; L.beginPath(); L.arc(ex - .3 * u, ey - .3 * u, .28 * u, 0, 7); L.fill();
        L.strokeStyle = INK; L.lineWidth = Math.max(1.2, .4 * u);                      // worried brows
        L.beginPath(); L.moveTo(ex + sd * 1.0 * u, ey - 1.45 * u); L.lineTo(ex - sd * .9 * u, ey - 2.1 * u); L.stroke();
      }
      L.strokeStyle = INK; L.lineWidth = Math.max(1.2, .4 * u);

      L.moveTo(cx - 3.4 * u, y - 8.6 * u); L.arc(cx, y - 9 * u, 3.4 * u, Math.PI * .95, Math.PI * 2.05);

    if (full) { L.strokeStyle = lt(p.hair, .5); L.lineWidth = Math.max(1, .45 * u); L.beginPath(); L.arc(cx - .4 * u, y - 9.2 * u, 2.8 * u, Math.PI * 1.15, Math.PI * 1.5); L.stroke(); }
  } else {                                                                              // sideburns under the hat

  }

  if (role === 'police') {                                                              // peaked cap
    cel(u, () => { L.moveTo(cx - 3.5 * u, y - 10.8 * u); L.lineTo(cx - 3.9 * u, y - 13.4 * u); L.quadraticCurveTo(cx, y - 15.4 * u, cx + 3.9 * u, y - 13.4 * u); L.lineTo(cx + 3.5 * u, y - 10.8 * u); L.closePath(); }, '#2c4a8a', dk('#2c4a8a'));

  } else if (role === 'fire') {                                                         // fire helmet
    cel(u, () => L.ellipse(cx, y - 10.5 * u, 4.8 * u, 1.0 * u, 0, 0, 7), '#a81e25', dk('#a81e25'));
    cel(u, () => { L.moveTo(cx - 3.8 * u, y - 10.6 * u); L.quadraticCurveTo(cx - 4.1 * u, y - 14.9 * u, cx, y - 15.1 * u); L.quadraticCurveTo(cx + 4.1 * u, y - 14.9 * u, cx + 3.8 * u, y - 10.6 * u); L.closePath(); }, '#c9242b', dk('#c9242b'));
    cel(u, () => L.roundRect(cx - .6 * u, y - 15.5 * u, 1.2 * u, 4.7 * u, .5 * u), '#a81e25', null);

    cel(u, () => { L.moveTo(cx - 3.6 * u, y - 10.8 * u); L.quadraticCurveTo(cx - 3.9 * u, y - 14.5 * u, cx, y - 14.7 * u); L.quadraticCurveTo(cx + 3.9 * u, y - 14.5 * u, cx + 3.6 * u, y - 10.8 * u); L.closePath(); }, '#ffd21f', dk('#ffd21f'));

    L.strokeStyle = '#c9d3e6'; L.lineWidth = Math.max(1, .45 * u); L.beginPath(); L.arc(cx, y - 9 * u, 3.3 * u, Math.PI * 1.12, Math.PI * 1.88); L.stroke();
    cel(u, () => L.arc(cx + .6 * u, y - 12 * u, 1.05 * u, 0, 7), '#eef3fb', '#a9b6cf'); shine(L, cx + .2 * u, y - 12.3 * u, .35 * u, .2 * u, -.6, .8);
  }

    L.strokeStyle = INK; L.lineWidth = Math.max(1, .4 * u);

  }

    cel(u, () => { L.ellipse(cx - .9 * u, y - 7.1 * u, 1.3 * u, .6 * u, .2, 0, 7); }, '#f4f4fa', '#c7cadb');
