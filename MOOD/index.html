  }

  if (!happy) {                                                                         // a little rain cloud over every sad person
    const cy = y - 17.6 * u, circles = [[-1.4, 0, 1.3], [0, -.7, 1.7], [1.5, 0, 1.3]];
    L.fillStyle = INK; for (const [dx, dy, r] of circles) { L.beginPath(); L.arc(cx + dx * u, cy + dy * u, r * u + lwFor(u) * .7, 0, 7); L.fill(); }
    L.fillStyle = 'rgba(214,226,244,.98)'; for (const [dx, dy, r] of circles) { L.beginPath(); L.arc(cx + dx * u, cy + dy * u, r * u, 0, 7); L.fill(); }
    L.strokeStyle = '#4fa8ff'; L.lineWidth = Math.max(1, .38 * u);
    for (let i = 0; i < 3; i++) {
      const k = (t * 1.6 + i / 3 + p.ph) % 1, x = cx - 1.2 * u + i * 1.2 * u, yy = cy + 1.4 * u + k * 2.5 * u;
      L.beginPath(); L.moveTo(x, yy); L.lineTo(x, yy + .6 * u); L.stroke();
    }
  } else {
    L.fillStyle = '#fff3a0';
    for (let i = 0; i < 3; i++) {
      const ang = t * 2 + i * 2.1 + p.ph, r = (1.1 + Math.sin(t * 8 + i) * .4) * u;
      star(cx + Math.cos(ang) * 6 * u, y - 11 * u + Math.sin(ang) * 4 * u, r);
    }
  }
  L.restore();
}

function drawBubble(x, y, text, life) {
  ctx.save();
  ctx.globalAlpha = Math.min(1, life);
  ctx.font = '900 12px "Press Start 2P", monospace';
  const w = ctx.measureText(text).width + 28, bx = Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, x));   // long one-liners stay on screen
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#2b1040'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(bx - w / 2, y - 38, w, 34, 14); ctx.fill(); ctx.stroke();
  const tx = Math.max(bx - w / 2 + 16, Math.min(bx + w / 2 - 16, x));
  ctx.beginPath(); ctx.moveTo(tx - 7, y - 4); ctx.lineTo(tx + 7, y - 4); ctx.lineTo(tx, y + 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2b1040'; ctx.textAlign = 'center';
  ctx.fillText(text, bx, y - 13);
  ctx.restore();
}

function drawSpirit(pr, s) {
  const a = Math.max(0, 1 - s.ascT / 6);
  if (a <= 0) return;
  const rise = Math.pow(s.ascT, 1.4) * H * .16;
  const x = pr.sx + Math.sin(s.ascT * 2 + s.look.ph) * pr.u * .8;
  const feet = pr.feet - rise;
  ctx.save();
  // sparkle trail
  for (let i = 0; i < 6; i++) {
    ctx.globalAlpha = a * (.6 - i * .08);
    ctx.fillStyle = PAL[i % 6];
    ctx.beginPath(); ctx.arc(x + Math.sin(t * 3 + i) * pr.u, feet + (i + 1) * 5 * pr.u, pr.u * (.8 - i * .1), 0, 7); ctx.fill();
  }
  // wings
  const flap = Math.sin(t * 9) * .5;
  ctx.globalAlpha = a * .75; ctx.fillStyle = '#ffffff';
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(x + side * 3 * pr.u, feet - 7 * pr.u);
    ctx.rotate(side * (.6 + flap));
    ctx.beginPath(); ctx.ellipse(side * 3 * pr.u, 0, 4.5 * pr.u, 1.8 * pr.u, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // ghostly body
  ctx.globalAlpha = a * .75;
  drawPerson(x, feet, pr.u, s.look, true);
  // halo
  ctx.globalAlpha = a;
  ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = Math.max(2, .5 * pr.u);
  ctx.beginPath(); ctx.ellipse(x, feet - 15.5 * pr.u, 3.2 * pr.u, 1 * pr.u, 0, 0, 7); ctx.stroke();
  ctx.restore();
}

function drawStairs(cx, feet, s, up) {
  ctx.save();
  // golden beacon rising above the walls so the staircase is easy to find
  const beam = ctx.createLinearGradient(0, feet - s * 14, 0, feet);
  beam.addColorStop(0, 'rgba(255,230,120,0)'); beam.addColorStop(1, 'rgba(255,230,120,.6)');
  ctx.fillStyle = beam; ctx.fillRect(cx - s * .45, feet - s * 14, s * .9, s * 14);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i % 2 ? '#ffe9a8' : '#ffd166';
    ctx.fillRect(cx - s * .6 + i * s * .3, feet - s * .25 * (i + 1), s * .3, s * .25 * (i + 1));
  }
  ctx.strokeStyle = '#2b1040'; ctx.lineWidth = Math.max(1, s * .05);
  ctx.strokeRect(cx - s * .6, feet - s, s * 1.2, s);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = `900 ${Math.max(10, s * .3)}px system-ui`;
  ctx.fillText(up ? '\u25B2 UP' : '\u25BC DOWN', cx, feet - s * 1.1);
  ctx.restore();
}

const BEAR_S = 2.2;

function drawInv() {
  const c = ic;
  c.clearRect(0, 0, 56, 56);
  const bg = c.createLinearGradient(0, 0, 0, 56);
  bg.addColorStop(0, hasKey ? '#7a5512' : '#2c1b3d'); bg.addColorStop(1, hasKey ? '#3a2606' : '#1a0f24');
  c.fillStyle = bg; c.fillRect(0, 0, 56, 56);
  c.save(); c.translate(28, 25); c.rotate(-.6); c.lineCap = 'round';
  if (hasKey) {
    const g = c.createRadialGradient(0, 0, 0, 0, 0, 28);
    g.addColorStop(0, 'rgba(255,230,120,.55)'); g.addColorStop(1, 'rgba(255,230,120,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 28, 0, 7); c.fill();
  }
  c.globalAlpha = hasKey ? 1 : .3;
  c.strokeStyle = hasKey ? '#ffd166' : '#8b7fa8'; c.lineWidth = 4;
  c.beginPath(); c.arc(-10, 0, 7, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(-3, 0); c.lineTo(16, 0); c.moveTo(10, 0); c.lineTo(10, 7); c.moveTo(15, 0); c.lineTo(15, 5); c.stroke();
  c.restore();
  c.textAlign = 'center'; c.font = '800 8px "Press Start 2P", monospace';
  c.fillStyle = hasKey ? '#fff3a0' : '#8b7fa8';
  if (hasKey) {                                                  // the check mark is drawn as a shape, so it lines up with the text
    c.textAlign = 'left'; const w = c.measureText('KEY').width, x0 = 28 - (w + 10) / 2;
    c.fillText('KEY', x0, 51);
    c.strokeStyle = '#fff3a0'; c.lineWidth = 2; c.beginPath(); c.moveTo(x0 + w + 3, 47); c.lineTo(x0 + w + 6, 50.5); c.lineTo(x0 + w + 10, 43.5); c.stroke();
  } else c.fillText('NO KEY', 28, 51);
}

function withColumnClip(sx, halfW, perp, zbuf, drawFn, topY) {   // topY: the sprite's highest screen row, so a sprite wholly behind a nearer wall is not drawn at all
  const x0 = Math.max(0, Math.floor(sx - halfW)), x1 = Math.min(W - 1, Math.ceil(sx + halfW));
  if (x1 < x0) return;
  ctx.save(); ctx.beginPath();
  let any = false, run = -1;
  const flush = x => { if (run >= 0) { ctx.rect(run, -H, x - run, H * 3); any = true; run = -1; } };
  for (let x = x0; x <= x1; x++) {
    if (zbuf[x] >= perp) { if (run < 0) run = x; continue; }
    flush(x);
    // A nearer wall hides only the part of the bear that the wall's own height covers.
    // The bear is taller than the walls, so everything above the top of the wall stays visible.
    const wallTop = H / 2 + FOCAL * EYE / zbuf[x] - Math.min(H * 8, FOCAL * wallH() / zbuf[x]);
    if (wallTop > -H && wallTop > (topY === undefined ? -H : topY)) { ctx.rect(x, -H, 1, wallTop + H); any = true; }
  }
  flush(x1 + 1);
  if (any) { ctx.clip(); drawFn(); }
  ctx.restore();
  return any;
}

function drawBossSprite(pr, b, zbuf) {
  const perp = Math.max(pr.perp, TUNING.bossMinDist);            // the bear stops growing when he is close, so the view never zooms in on his face
  const k = FOCAL / perp / 14 * BEAR_S, feet = H / 2 + FOCAL * EYE / perp;
  withColumnClip(pr.sx, 12 * k, pr.perp, zbuf, () => {
    const bx = pr.sx + Math.sin(t * 2) * k * .25;
    if (b.spin) drawBearSpin(bx, feet, k, b, b.spin.rot); else drawBear(bx, feet, k, b);
  });   // he is taller than the walls, so his head and shoulders show above them
}

// The spin: the original bear, turned about his upright axis. He is squeezed sideways as he turns (his height
// never changes), and when he faces away the same drawing is shown without its face.
function drawBearSpin(cx, feet, k, b, phi) {
  const L = ctx, c = Math.cos(phi);
  L.save(); L.translate(cx, 0); L.scale(Math.max(.04, Math.abs(c)), 1); L.translate(-cx, 0);
  b.away = c < 0;
  drawBear(cx, feet, k, b);
  b.away = false;
  L.restore();
}

function drawBear(cx, feet, k, b) {
  const L = ctx, u = k;
  const happy = b.dead, hurt = b.hurtT > 0, rage = b.hp < b.max * .34, shot = b.shotAnim > 0;
  const away = !!b.away;   // facing away, during the spin: no face
  const fur = hurt ? '#ffd8ca' : '#b0743c', furD = hurt ? '#f0b8a6' : '#7d4e24';
  const belly = hurt ? '#fff1e8' : '#f0cf9e', bellyD = hurt ? '#f2d6c4' : '#c99a62';
  // how high the arms are raised (0 down, 1 up), eased so they never snap: set directly in the cutscene, ramped after a shot, ramped up when he is won over
  const lift = Math.max(0, Math.min(1, b.dead ? (b.deadT || 0) / .3 : b.arms !== undefined ? b.arms : shot ? Math.min((.4 - b.shotAnim) / .08, b.shotAnim / .15, 1) : 0));
  const walkOn = !!b.walking && !b.dead, ph = b.walkStep | 0;   // stop-motion stride: four poses, stepping a few times a second while he moves
  const legFwd = sd => walkOn ? [1, 0, -1, 0][(ph + (sd < 0 ? 2 : 0)) & 3] : 0;   // +1 planted forward, -1 planted back, 0 passing
  const legUp = sd => (walkOn && ((ph + (sd < 0 ? 2 : 0)) & 1)) ? 1 : 0;          // foot lifted on the passing poses
  const y = feet - (happy ? Math.abs(Math.sin(t * 6)) * k * .6 : 0);
  L.save(); L.lineCap = 'round'; L.lineJoin = 'round';
  L.fillStyle = 'rgba(0,0,0,.3)'; L.beginPath(); L.ellipse(cx, feet + .3 * k, 6.2 * k, 1.5 * k, 0, 0, 7); L.fill();
  for (const sd of [-1, 1]) {                                                         // feet with pads
    const fx = cx + sd * 3 * k + legFwd(sd) * 1.6 * k, fy = y - legUp(sd) * .9 * k;
    cel(u, () => L.ellipse(fx, fy - 1.8 * k, 2.3 * k, 2.1 * k, 0, 0, 7), fur, furD);
    cel(u, () => L.ellipse(fx, fy - 1.1 * k, 1.35 * k, 1.0 * k, 0, 0, 7), belly, bellyD);
  }
  for (const sd of [-1, 1]) {                                                         // arms
    L.save(); L.translate(cx + sd * 5 * k, y - 8 * k);
    L.rotate(sd * (.5 - 2.8 * lift) + (happy ? Math.sin(t * 8) * .3 * lift : 0) + legFwd(-sd) * .35);   // each arm swings against the leg on its own side
    cel(u, () => L.ellipse(0, 2.2 * k, 1.95 * k, 3.5 * k, 0, 0, 7), fur, furD);
    cel(u, () => L.arc(0, 4.9 * k, 1.1 * k, 0, 7), belly, bellyD);
    L.restore();
  }
  cel(u, () => L.ellipse(cx, y - 6 * k, 5.1 * k, 5.7 * k, 0, 0, 7), fur, furD);       // body
  cel(u, () => L.ellipse(cx, y - 5.6 * k, 3.3 * k, 3.9 * k, 0, 0, 7), belly, bellyD);  // belly
  if (!away)   cel(u, () => heartPath(L, cx, y - 5.6 * k, 1.3 * k), '#ff5d8f', '#c93a6a');           // heart on the tummy
  shine(L, cx - .45 * k, y - 6.1 * k, .35 * k, .2 * k, -.7, .7);
  for (const sd of [-1, 1]) {                                                           // ears
    cel(u, () => L.arc(cx + sd * 3.6 * k, y - 15.2 * k, 1.95 * k, 0, 7), fur, furD);
    cel(u, () => L.arc(cx + sd * 3.6 * k, y - 15.2 * k, 1.05 * k, 0, 7), belly, bellyD);
  }
  cel(u, () => L.arc(cx, y - 11.8 * k, 4.5 * k, 0, 7), fur, furD);                      // head
  shine(L, cx - 2.2 * k, y - 14.2 * k, .8 * k, .4 * k, -.7, .35);
  if (!away) {
  cel(u, () => L.ellipse(cx, y - 10.3 * k, 2.2 * k, 1.7 * k, 0, 0, 7), belly, bellyD);   // muzzle
  cel(u, () => L.ellipse(cx, y - 11.2 * k, .9 * k, .62 * k, 0, 0, 7), '#2a1a22', null);   // nose
  shine(L, cx - .3 * k, y - 11.4 * k, .3 * k, .14 * k, -.4, .8);
  L.strokeStyle = INK; L.lineWidth = Math.max(1.4, Math.min(5, .28 * k));
  L.beginPath(); L.moveTo(cx, y - 10.6 * k); L.lineTo(cx, y - 9.9 * k); L.stroke();
  if (shot) {                                                                           // mouth open, firing
    cel(u, () => L.ellipse(cx, y - 9.2 * k, 1.3 * k, 1.15 * k, 0, 0, 7), '#5a1020', null);
    L.save(); L.beginPath(); L.ellipse(cx, y - 9.2 * k, 1.3 * k, 1.15 * k, 0, 0, 7); L.clip();
    L.fillStyle = '#ff7a94'; L.beginPath(); L.ellipse(cx, y - 8.4 * k, 1 * k, .7 * k, 0, 0, 7); L.fill(); L.restore();
  } else if (happy) {
    L.beginPath(); L.arc(cx, y - 9.9 * k, 1.5 * k, .1, Math.PI - .1); L.stroke();
  } else {
    L.beginPath(); L.arc(cx, y - 8.5 * k, 1.6 * k, Math.PI * 1.15, Math.PI * 1.85); L.stroke();
  }
  for (const sd of [-1, 1]) {                                                           // eyes
    const ex = cx + sd * 1.9 * k, ey = y - 12.8 * k;
    if (happy) {
      L.beginPath(); L.arc(ex, ey, 1.0 * k, Math.PI * 1.05, Math.PI * 1.95); L.stroke();
    } else {
      L.fillStyle = '#fff'; L.beginPath(); L.ellipse(ex, ey, 1.15 * k, 1.3 * k, 0, 0, 7); L.fill(); L.lineWidth = lwFor(u) * .8; L.stroke();
      L.fillStyle = rage ? '#ff2a3a' : '#2a1a3a'; L.beginPath(); L.arc(ex - sd * .2 * k, ey + .1 * k, .72 * k, 0, 7); L.fill();
      L.fillStyle = INK; L.beginPath(); L.arc(ex - sd * .2 * k, ey + .15 * k, .38 * k, 0, 7); L.fill();
      L.fillStyle = '#fff'; L.beginPath(); L.arc(ex - sd * .2 * k - .3 * k, ey - .25 * k, .26 * k, 0, 7); L.fill();
      L.strokeStyle = INK; L.lineWidth = Math.max(2, Math.min(9, .5 * k));               // angry brows
      L.beginPath(); L.moveTo(ex + sd * 1.5 * k, ey - 1.9 * k); L.lineTo(ex - sd * 1.2 * k, ey - 1.05 * k); L.stroke();
      L.lineWidth = Math.max(1.4, Math.min(5, .28 * k));
    }
  }
  }
  if (!away) {
  cel(u, () => { L.moveTo(cx, y - 7.6 * k); L.lineTo(cx - 2 * k, y - 8.5 * k); L.lineTo(cx - 2 * k, y - 6.7 * k); L.closePath(); }, '#ff4d4d', '#b92a3a');    // bow tie
  cel(u, () => { L.moveTo(cx, y - 7.6 * k); L.lineTo(cx + 2 * k, y - 8.5 * k); L.lineTo(cx + 2 * k, y - 6.7 * k); L.closePath(); }, '#4d9fff', '#2a64b8');
  cel(u, () => L.roundRect(cx - .45 * k, y - 8.05 * k, .9 * k, .9 * k, .25 * k), '#ffd166', dk('#ffd166'));
  }
  if (happy) {
    for (let i = 0; i < 3; i++) {
      const hx = cx + Math.sin(t * 2 + i * 2) * 5 * k, hy = y - 17.5 * k - ((t * 3 + i) % 3) * 2 * k;
      cel(u, () => heartPath(L, hx, hy, 1.1 * k), '#ff4d8d', '#c93a6a');
    }
  }
  L.restore();
}

let rainbowSpr = null;
function getRainbowSprite() {                              // the emoji is rasterised once, then simply blitted
  if (rainbowSpr) return rainbowSpr;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.font = '100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('\u{1F308}', 64, 70);
  try {                                                    // if the system has no emoji font, draw a plain rainbow instead
    const d = g.getImageData(0, 0, 128, 128).data; let any = false;
    for (let i = 3; i < d.length; i += 16) if (d[i] > 0) { any = true; break; }
    if (!any) {
      g.lineWidth = 9;
      ['#ff4d4d', '#ff9f4d', '#ffe14d', '#5fd16a', '#4da6ff', '#9b6bff'].forEach((col, i) => { g.strokeStyle = col; g.beginPath(); g.arc(64, 96, 54 - i * 8.5, Math.PI, 2 * Math.PI); g.stroke(); });
    }
  } catch (e) {}
  return rainbowSpr = c;
}

function drawRainbow(pr, r) {
  const size = Math.max(14, FOCAL / pr.perp * .6);
  ctx.save();
  ctx.translate(pr.sx, H / 2 + FOCAL / pr.perp * .05 + (EYE - r.eye0) * FOCAL / pr.perp + Math.sin(t * 8 + r.ph) * size * .05);
  ctx.rotate(Math.sin(t * 6 + r.ph) * .25);
  ctx.drawImage(getRainbowSprite(), -size / 2, -size / 2, size, size);
  ctx.restore();
}

function drawBearShadow(cx, base, k) {
  ctx.save(); ctx.translate(cx, base); ctx.scale(k, k);
  ctx.fillStyle = '#12081f';
  ctx.beginPath(); ctx.ellipse(0, -80, 120, 140, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -250, 90, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(-70, -325, 38, 0, 7); ctx.arc(70, -325, 38, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(255,60,80,${.6 + .4 * Math.sin(t * 6)})`;
  ctx.beginPath(); ctx.arc(-32, -258, 11, 0, 7); ctx.arc(32, -258, 11, 0, 7); ctx.fill();
  ctx.restore();
}

function drawBaby(pr, s) {
  const u = pr.u, L = ctx, happy = s.happy, ph = s.look.ph;
  const cx = pr.sx + Math.sin(t * (happy ? 4 : 2) + ph) * u * (happy ? .5 : .3);   // the stroller rocks
  const feet = pr.feet;
  const col = ['#ff8fb8', '#6fd6b0', '#ffd24d', '#8fb0ff'][Math.floor(ph) % 4], colD = dk(col);
  const full = u >= 2.2;
  L.save(); L.lineCap = 'round'; L.lineJoin = 'round';
  L.fillStyle = 'rgba(0,0,0,.28)'; L.beginPath(); L.ellipse(cx, feet + .3 * u, 5.6 * u, 1.2 * u, 0, 0, 7); L.fill();
  // push handle: an ink outline with a metal tube on top
  const handle = () => { L.beginPath(); L.moveTo(cx - 4.1 * u, feet - 5 * u); L.lineTo(cx - 4.5 * u, feet - 11 * u); L.lineTo(cx + 4.5 * u, feet - 11 * u); L.lineTo(cx + 4.1 * u, feet - 5 * u); };
  handle(); L.strokeStyle = INK; L.lineWidth = Math.max(2.4, .95 * u); L.stroke();
  handle(); L.strokeStyle = '#b9b3cc'; L.lineWidth = Math.max(1.2, .45 * u); L.stroke();
  // striped canopy
  const arch = () => { L.ellipse(cx, feet - 6.5 * u, 4.9 * u, 5.7 * u, 0, Math.PI, 2 * Math.PI); L.closePath(); };
  L.save(); L.beginPath(); arch(); L.clip();
  L.fillStyle = '#fffaf0'; L.fillRect(cx - 5.2 * u, feet - 13 * u, 10.4 * u, 7 * u);
  L.fillStyle = col;
  for (let i = -2; i <= 2; i++) L.fillRect(cx + i * 2 * u - .8 * u, feet - 13 * u, 1.6 * u, 7 * u);
  L.fillStyle = 'rgba(60,40,90,.2)'; L.beginPath(); L.ellipse(cx + 1.4 * u, feet - 6.2 * u, 4.9 * u, 5.7 * u, 0, Math.PI, 2 * Math.PI); L.rect(cx - 6 * u, feet - 13 * u, 3 * u, 8 * u); L.fill();
  L.restore();
  L.beginPath(); arch(); L.lineWidth = lwFor(u); L.strokeStyle = INK; L.stroke();
  // the baby: shoulders, head and bonnet
  cel(u, () => L.ellipse(cx, feet - 6.4 * u, 2.9 * u, 2 * u, 0, 0, 7), '#fff6d8', '#dccd9c');
  cel(u, () => L.arc(cx, feet - 8.2 * u, 2.3 * u, 0, 7), '#ffdcbc', '#e9a98a');
  cel(u, () => { L.arc(cx, feet - 8.4 * u, 2.5 * u, Math.PI, Math.PI * 2); L.closePath(); }, col, colD);
  cel(u, () => L.arc(cx, feet - 11 * u, .55 * u, 0, 7), '#fffaf0', '#d8d0c0');
  if (full) shine(L, cx - 1.2 * u, feet - 9.9 * u, .5 * u, .25 * u, -.5, .5);
  // face
  if (full) {
    L.lineCap = 'round'; L.strokeStyle = INK; L.lineWidth = Math.max(1.1, .36 * u);
    if (happy) {
      for (const sd of [-1, 1]) { L.beginPath(); L.arc(cx + sd * .95 * u, feet - 8.3 * u, .55 * u, Math.PI * 1.05, Math.PI * 1.95); L.stroke(); }
      cel(u, () => L.ellipse(cx, feet - 7.5 * u, .95 * u, .9 * u, 0, 0, Math.PI), '#7a2a4a', null);
    } else {
      for (const sd of [-1, 1]) {
        L.beginPath(); L.moveTo(cx + sd * 1.5 * u, feet - 8.9 * u); L.lineTo(cx + sd * .55 * u, feet - 8.4 * u); L.lineTo(cx + sd * 1.5 * u, feet - 7.95 * u); L.stroke();
      }
      cel(u, () => L.ellipse(cx, feet - 7.2 * u, .85 * u, 1.05 * u, 0, 0, 7), '#7a2a4a', null);
      L.save(); L.beginPath(); L.ellipse(cx, feet - 7.2 * u, .85 * u, 1.05 * u, 0, 0, 7); L.clip();
      L.fillStyle = '#ff8fa8'; L.beginPath(); L.ellipse(cx, feet - 6.5 * u, .7 * u, .5 * u, 0, 0, 7); L.fill(); L.restore();
    }
    L.fillStyle = 'rgba(255,110,140,.55)';
    L.beginPath(); L.ellipse(cx - 1.65 * u, feet - 7.7 * u, .5 * u, .35 * u, 0, 0, 7); L.ellipse(cx + 1.65 * u, feet - 7.7 * u, .5 * u, .35 * u, 0, 0, 7); L.fill();
  }
  // seat, with polka dots
  cel(u, () => L.roundRect(cx - 4.3 * u, feet - 6 * u, 8.6 * u, 4.2 * u, 1.6 * u), col, colD);
  if (full) {
    L.fillStyle = 'rgba(255,255,255,.75)';
    for (const [dx, dy] of [[-2.8, -4.6], [-.6, -3.1], [1.8, -4.8], [3, -3.2]]) { L.beginPath(); L.arc(cx + dx * u, feet + dy * u, .38 * u, 0, 7); L.fill(); }
    shine(L, cx - 3.4 * u, feet - 5.2 * u, .35 * u, 1.2 * u, 0, .45);
  }
  // wheels
  for (const sd of [-1, 1]) {
    cel(u, () => L.ellipse(cx + sd * 4.7 * u, feet - 1.5 * u, 1.15 * u, 1.55 * u, 0, 0, 7), '#2b2236', null);
    cel(u, () => L.arc(cx + sd * 4.7 * u, feet - 1.5 * u, .45 * u, 0, 7), '#c9c2d6', null);
  }
  // little fists: balled up when crying, waving a rattle when happy
  if (happy) {
    const wv = Math.sin(t * 10 + ph) * .6 * u, hx = cx + 4.7 * u + wv, hy = feet - 10.1 * u;
    L.strokeStyle = INK; L.lineWidth = Math.max(2, .8 * u); L.beginPath(); L.moveTo(cx + 3.6 * u, feet - 6.6 * u); L.lineTo(hx, hy + .6 * u); L.stroke();
    L.strokeStyle = '#8a6fbf'; L.lineWidth = Math.max(1, .4 * u); L.beginPath(); L.moveTo(cx + 3.6 * u, feet - 6.6 * u); L.lineTo(hx, hy + .6 * u); L.stroke();
    cel(u, () => L.arc(hx, hy, .95 * u, 0, 7), '#ffd166', dk('#ffd166'));
    cel(u, () => L.arc(cx + 3.6 * u, feet - 6.6 * u, .62 * u, 0, 7), '#ffdcbc', '#e9a98a');
    cel(u, () => L.arc(cx - 3.4 * u, feet - 7.6 * u, .62 * u, 0, 7), '#ffdcbc', '#e9a98a');
  } else {
    const sh = Math.sin(t * 14 + ph) * .15 * u;
    cel(u, () => L.arc(cx - 3.2 * u + sh, feet - 7.7 * u, .62 * u, 0, 7), '#ffdcbc', '#e9a98a');
    cel(u, () => L.arc(cx + 3.2 * u - sh, feet - 7.7 * u, .62 * u, 0, 7), '#ffdcbc', '#e9a98a');
  }
  if (happy) {
    L.fillStyle = '#fff3a0';
    for (let i = 0; i < 3; i++) {
      const ang = t * 2 + i * 2.1 + ph;
      star(cx + Math.cos(ang) * 6 * u, feet - 12 * u + Math.sin(ang) * 3 * u, (1.1 + Math.sin(t * 8 + i) * .4) * u);
    }
  } else {
    for (const sd of [-1, 1]) for (let i = 0; i < 2; i++) {       // streaming tears
      const k = (t * 1.6 + i * .5 + ph) % 1;
      L.fillStyle = '#7fd1ff'; L.beginPath(); L.arc(cx + sd * (1.3 + k * 1.2) * u, feet - 8.2 * u + k * 2.4 * u, .4 * u, 0, 7); L.fill();
    }
    const cy = feet - 14.8 * u, circles = [[-1.4, 0, 1.3], [0, -.7, 1.7], [1.5, 0, 1.3]];   // rain cloud, like the other sad people
    L.fillStyle = INK; for (const [dx, dy, r] of circles) { L.beginPath(); L.arc(cx + dx * u, cy + dy * u, r * u + lwFor(u) * .7, 0, 7); L.fill(); }
    L.fillStyle = 'rgba(214,226,244,.98)'; for (const [dx, dy, r] of circles) { L.beginPath(); L.arc(cx + dx * u, cy + dy * u, r * u, 0, 7); L.fill(); }
    L.strokeStyle = '#4fa8ff'; L.lineWidth = Math.max(1, .38 * u);
    for (let i = 0; i < 3; i++) {
      const k = (t * 1.6 + i / 3 + ph) % 1, x = cx - 1.2 * u + i * 1.2 * u, yy = cy + 1.4 * u + k * 2.5 * u;
      L.beginPath(); L.moveTo(x, yy); L.lineTo(x, yy + .6 * u); L.stroke();
    }
  }
  L.restore();
}

const CAMO_COLORS = ['#2f3a1c', '#8a7a4a', '#3b2f1f', '#1c1c14'];   // dark green, tan, brown, near-black
const CAMO = (() => {                                      // a fixed blotch pattern, so it never shimmers
  let seed = 7;
  const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const blobs = [];
  for (let i = 0; i < 44; i++) blobs.push({ x: r() * 2 - 1, y: -r(), r: .09 + r() * .15, sx: .7 + r() * .9, rot: r() * 3, c: CAMO_COLORS[i % 4] });
  return blobs;
})();

function drawParachuter(pr, s) {
  const u = pr.u, feet = pr.feet - s.air * FOCAL / pr.perp;
  const k = 1 - s.chute;                                   // 0 while the canopy is open, 1 once it has collapsed
  const cx = pr.sx + (s.air > 0 ? Math.sin(t * 2 + 1) * u * 1.2 : 0);
  if (s.air <= 0 && s.chute > 0) {                         // dust puff as he touches down
    ctx.save(); ctx.globalAlpha = Math.min(.6, s.chute * .7); ctx.fillStyle = '#e8d9b8';
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05, r = k * 6 * u;
      ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * r, feet - .5 * u + Math.sin(a) * r * .25, (1.6 + k) * u, .9 * u, 0, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  const R = 10 * u * (1 + .3 * k), cy = feet - 27 * u + k * 25 * u;
  if (k < .6) {                                            // lines from the canopy to his shoulders
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#c9bf8f'; ctx.lineWidth = Math.max(1, .25 * u);
    for (const bx of [-R, -R * .5, R * .5, R]) {
      ctx.beginPath(); ctx.moveTo(cx + bx, cy); ctx.lineTo(cx + Math.sign(bx) * 2.4 * u, feet - 11 * u); ctx.stroke();
    }
    ctx.restore();
  }
  drawPerson(cx, feet, u, s.look, true);
  ctx.save(); ctx.globalAlpha = Math.min(1, s.chute * 1.5); ctx.translate(cx, cy); ctx.scale(1, 1 - .78 * k);
  ctx.save();                                              // the canopy: olive drab with woodland camouflage
  ctx.beginPath(); ctx.arc(0, 0, R, Math.PI, 2 * Math.PI); ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#4b5320'; ctx.fillRect(-R, -R, 2 * R, R);
  for (const b of CAMO) {
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.ellipse(b.x * R, b.y * R, b.r * R * b.sx, b.r * R, b.rot, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(20,24,10,.65)'; ctx.lineWidth = Math.max(1, .25 * u);
  for (let i = 1; i < 6; i++) {                            // panel seams
    const a = Math.PI + i * Math.PI / 6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); ctx.stroke();
  }
  ctx.fillStyle = '#1c1c14'; ctx.beginPath(); ctx.arc(0, -R * .95, R * .06, 0, 7); ctx.fill();   // apex vent
  ctx.restore();
  ctx.strokeStyle = '#2a2f14'; ctx.lineWidth = Math.max(1.5, .4 * u);
  ctx.beginPath(); ctx.arc(0, 0, R, Math.PI, 2 * Math.PI); ctx.closePath(); ctx.stroke();
  ctx.restore();
}

const BOSS_LINE = 'Play time is over, punk!';
const bossFace = { hp: 3, max: 20, hurtT: 0, shotAnim: 0, dead: false };   // low hp gives him the red, furious eyes

function startBossIntro() {
  bossIntroSeen = true;
  state = 'bossintro'; bIntroT = 0; bIntroTyped = 0;
  msgT = 0; pitch = 0;
  sfx([[70, .6, 'sawtooth'], [55, .8, 'sawtooth', .1]]);   // a low growl
}

function endBossIntro() {
  state = 'play'; pitch = 0;
  say('A giant teddy bear is angry! Hit him with candy!');
}

function drawBossIntro() {
  const T = bIntroT, PULL = 3.3, END = 4.9;
  const p = T <= PULL ? 0 : Math.min(1, (T - PULL) / (END - PULL));   // progress of the pull-back
  const e = p * p * (3 - 2 * p);                                      // smooth ease in and out
  const kClose = 40 + Math.min(T, PULL) * 3.2;                        // slow push-in on his face
  const feetClose = H / 2 + 11.8 * kClose + 10;
  let k = kClose, cx = W / 2, feet = feetClose;

  const pr = p > 0 && boss ? project(boss, true) : null;
  if (pr) {
    // A real camera zoom: the arena is drawn magnified about the bear, and the magnification eases
    // down to 1, so the walls, floor and pillars sweep into view around a single bear.
    const endPerp = Math.max(pr.perp, TUNING.bossMinDist), feetEnd = H / 2 + FOCAL / (2 * endPerp);   // the same size and spot the fight uses
    const kEnd = FOCAL / endPerp / 14 * BEAR_S, cxEnd = pr.sx + Math.sin(t * 2) * kEnd * .25;
    k = kClose * Math.pow(kEnd / kClose, e);                          // exponential zoom feels like a steady dolly
    cx = W / 2 + (cxEnd - W / 2) * e;
    feet = feetClose + (feetEnd - feetClose) * e;
    const z = k / kEnd;
    ctx.save();
    ctx.translate(cx - z * cxEnd, feet - z * feetEnd);                // the arena spot he stands on lands under the zoomed bear
    ctx.scale(z, z);
    render();                                                         // the arena without its own bear (hidden during the cutscene)
    ctx.restore();
  }

  const bgA = Math.max(0, 1 - p * 1.35);                              // the dark room dissolves as the arena comes into view
  if (bgA > 0) {
    ctx.save(); ctx.globalAlpha = bgA;
    const bg = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 520);
    bg.addColorStop(0, '#5a2a63'); bg.addColorStop(1, '#0d0618');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  bossFace.shotAnim = (T > 1.2 && T < 1.28 + BOSS_LINE.length * .075 && Math.sin(T * 16) > 0) ? 1 : 0;   // the mouth moves while he talks and stops cleanly
  bossFace.arms = bossArmLift(T);   // the mouth moves while he talks
  bossFace.hp = p > .8 ? 20 : 3;                                              // furious eyes until he is back in the arena
  ctx.save();
  ctx.translate(T > 1.2 ? Math.sin(T * 40) * 1.2 * (1 - p) : 0, 0);           // a menacing tremble that settles
  drawBear(cx, feet, k, bossFace);                                            // the one and only bear
  ctx.restore();

  if (bgA > 0) {
    ctx.save(); ctx.globalAlpha = bgA;
    const vg = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 480);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  const shown = BOSS_LINE.slice(0, bIntroTyped);
  const capA = Math.max(0, 1 - p * 1.5);
  if (shown && capA > 0) {                                            // caption, typed out as he speaks
    ctx.save(); ctx.globalAlpha = capA; ctx.textBaseline = 'middle'; ctx.font = '900 26px "Press Start 2P", monospace';
    const w = ctx.measureText(BOSS_LINE).width + 60;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, H - 100, w, 66, 18); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(shown, W / 2 - w / 2 + 30, H - 66);
    ctx.restore();
  }

  if (T < .7) { ctx.fillStyle = `rgba(0,0,0,${1 - T / .7})`; ctx.fillRect(0, 0, W, H); }   // fade in from black at the start only
}

function drawKey(cx, cy, s) {
  cy += Math.sin(t * 3) * s * .15;
  const L = ctx; L.save();
  const g = L.createRadialGradient(cx, cy, 0, cx, cy, s * 2.5);
  g.addColorStop(0, 'rgba(255,230,120,.6)'); g.addColorStop(1, 'rgba(255,230,120,0)');
  L.fillStyle = g; L.beginPath(); L.arc(cx, cy, s * 2.5, 0, 7); L.fill();
  L.lineCap = 'round'; L.lineJoin = 'round';
  const shape = () => {
    L.beginPath(); L.arc(cx - s * .5, cy, s * .45, 0, 7);
    L.moveTo(cx - s * .05, cy); L.lineTo(cx + s * .9, cy);
    L.moveTo(cx + s * .6, cy); L.lineTo(cx + s * .6, cy + s * .3);
    L.moveTo(cx + s * .85, cy); L.lineTo(cx + s * .85, cy + s * .25);
  };
  shape(); L.strokeStyle = INK; L.lineWidth = Math.max(3.5, s * .5); L.stroke();      // ink outline
  shape(); L.strokeStyle = '#ffd166'; L.lineWidth = Math.max(2, s * .26); L.stroke();   // gold
  L.beginPath(); L.moveTo(cx - s * .75, cy - s * .2); L.lineTo(cx - s * .55, cy - s * .38);
  L.strokeStyle = '#fff6c4'; L.lineWidth = Math.max(1, s * .1); L.stroke();             // glint
  L.restore();
}

function drawPVCGun() {                                    // the boss arena launcher, seen in perspective: a bulky olive-green tube running away from you, with a flared mouth
  const L = ctx;
  const mx = W * .56, my = H * .6 + recoil * TUNING.lollipopKick;   // the far end, where the rockets leave
  const rx = W * 1.08, ry = H * 1.02;                               // the near end, low on the right, beyond the screen
  const dx = mx - rx, dy = my - ry, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  const Rn = 150, Rf = 30;                                          // the tube's radius at the near end and the far end: nearer is bigger
  const GREEN = '#7a9a3e', SHADE = '#4d6428', LIGHT = '#b7cf7a', BAND = '#66803a', FLARE = '#8ea84f', BORE = '#1c2412', RIM = '#a6c46a';
  const at = f => [mx + (rx - mx) * f, my + (ry - my) * f];        // f = 0 at the far end, 1 at the near end
  const R = f => Rf + (Rn - Rf) * f;
  const ring = (f, rad, fill, stroke, lw) => {                      // a circle along the tube, seen edge-on as an ellipse
    const [x, y] = at(f);
    L.beginPath(); L.ellipse(x, y, rad, rad * .3, Math.atan2(ny, nx), 0, 7);
    if (fill) { L.fillStyle = fill; L.fill(); }
    if (stroke) { L.lineWidth = lw; L.strokeStyle = stroke; L.stroke(); }
  };
  L.save(); L.lineCap = 'round'; L.lineJoin = 'round';
  // the body: a tapered tube, widest at the near end
  const a1 = [rx + nx * Rn, ry + ny * Rn], a2 = [rx - nx * Rn, ry - ny * Rn];
  const b1 = [mx + nx * Rf, my + ny * Rf], b2 = [mx - nx * Rf, my - ny * Rf];
  L.beginPath(); L.moveTo(...a1); L.lineTo(...b1); L.lineTo(...b2); L.lineTo(...a2); L.closePath();
  L.fillStyle = GREEN; L.fill(); L.lineWidth = lwFor(12); L.strokeStyle = INK; L.stroke();
  // shade down one side, a highlight down the other
  L.beginPath(); L.moveTo(rx + nx * Rn * .6, ry + ny * Rn * .6); L.lineTo(mx + nx * Rf * .6, my + ny * Rf * .6);
  L.lineWidth = Math.max(6, Rn * .32); L.strokeStyle = SHADE; L.stroke();
  L.beginPath(); L.moveTo(rx - nx * Rn * .5, ry - ny * Rn * .5); { const [hx, hy] = at(.02); L.lineTo(hx - nx * R(.02) * .5, hy - ny * R(.02) * .5); }   // the highlight stops 2% short of the mouth
  L.lineWidth = Math.max(3, Rn * .1); L.strokeStyle = LIGHT; L.stroke();
  // bands around the tube, and the flared mouth at the far end
  // the sight, standing on the top of the tube (the side that faces up the screen)
  const up = ny < 0 ? 1 : -1, px = nx * up, py = ny * up;
  const sightAt = (f, half, height, wdt) => {
    const [sx, sy] = at(f), bx = sx + px * R(f) * 1.02, by = sy + py * R(f) * 1.02;
    const ex = ux * half, ey = uy * half, hx = px * height, hy = py * height;
    L.beginPath(); L.moveTo(bx - ex, by - ey); L.lineTo(bx + ex, by + ey); L.lineTo(bx + ex + hx, by + ey + hy); L.lineTo(bx - ex + hx, by - ey + hy);
    L.closePath(); L.fillStyle = SHADE; L.fill(); L.lineWidth = lwFor(12); L.strokeStyle = INK; L.stroke();
  };
  sightAt(.3, 14, 22, 0);   // rear sight block
  sightAt(.04, 4, 26, 0);   // front post
  L.restore();
}

function drawGun() {                                       // the lollipop launcher at the bottom right: a striped stick and a big swirl head
  if (levelNo === 3) { drawPVCGun(); return; }
  const sway = Math.sin(t * 5) * (moving ? 7 : 2), L = ctx, u = 9;
  const x = W * .72 + sway, y = H + 4 + recoil * TUNING.lollipopKick, hx = x, hy = y - 178, R = TUNING.lollipopSize;
  L.save(); L.lineCap = 'round'; L.lineJoin = 'round';
  L.translate(x, y); L.rotate(-recoil * .06); L.translate(-x, -y);   // a little kick when it fires
  const stick = () => L.roundRect(x - 14, hy + 40, 28, 240, 13);
  L.save(); L.beginPath(); stick(); L.clip();                                  // candy-striped stick
  L.fillStyle = '#ffffff'; L.fillRect(x - 16, hy + 36, 32, 250);
  L.fillStyle = '#ff5f8f';
  for (let i = -2; i < 9; i++) { const sy = hy + 44 + i * 34; L.beginPath(); L.moveTo(x - 16, sy); L.lineTo(x + 16, sy - 26); L.lineTo(x + 16, sy - 6); L.lineTo(x - 16, sy + 20); L.closePath(); L.fill(); }
  L.fillStyle = 'rgba(50,20,90,.22)'; L.fillRect(x + 5, hy + 36, 14, 250);       // cel shadow down the right side
  L.fillStyle = 'rgba(255,255,255,.75)'; L.fillRect(x - 9, hy + 44, 5, 220);      // gloss
  L.restore();
  L.beginPath(); stick(); L.lineWidth = lwFor(u); L.strokeStyle = INK; L.stroke();
  cel(u, () => L.ellipse(x, hy + R - 8, 21, 9, 0, 0, 7), '#ffffff', '#c9cfe6');   // collar where the stick meets the candy
  const head = () => L.arc(hx, hy, R, 0, 7);
  L.save(); L.beginPath(); head(); L.clip();                                   // the candy: a rainbow swirl
  L.fillStyle = '#fff6fb'; L.fillRect(hx - R, hy - R, 2 * R, 2 * R);
  L.lineWidth = R / 6.2; L.lineCap = 'round';
  const turns = 3.2, TAU = Math.PI * 2;
  for (let k = 0; k < 160; k++) {
    const a0 = k / 160 * turns * TAU, a1 = (k + 1.6) / 160 * turns * TAU;
    const r0 = a0 / (turns * TAU) * R * .9, r1 = a1 / (turns * TAU) * R * .9;
    L.strokeStyle = PAL[Math.floor(k / 14) % 6];
    L.beginPath(); L.moveTo(hx + Math.cos(a0 + .6) * r0, hy + Math.sin(a0 + .6) * r0); L.lineTo(hx + Math.cos(a1 + .6) * r1, hy + Math.sin(a1 + .6) * r1); L.stroke();
  }
  L.fillStyle = 'rgba(60,30,110,.2)';                                          // cel shadow crescent on the lower right
  L.beginPath(); L.arc(hx, hy, R, 0, TAU); L.moveTo(hx - 12 + R, hy - 10); L.arc(hx - 12, hy - 10, R, 0, TAU, true); L.fill();
  L.restore();
  L.beginPath(); head(); L.lineWidth = lwFor(u * 1.5); L.strokeStyle = INK; L.stroke();
  shine(L, hx - 27, hy - 29, 19, 9, -.7, .85); shine(L, hx - 8, hy - 44, 6, 3.5, -.4, .7);
  L.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1 - p.life / p.max) * 2);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.kind === 'heart') {
      ctx.font = `${p.size}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('\u2665', 0, 0);
    } else {
      star(0, 0, p.size);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function burst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 0, max: 1.2 + Math.random() * .8,
      kind: i % 2 ? 'heart' : 'spark', color: PAL[i % 6], rot: 0, vr: (Math.random() - .5) * 8,
      size: i % 2 ? 10 + Math.random() * 8 : 3 + Math.random() * 4 });
  }
}

// A smooth ease in and out, so the sun or moon rises, pauses, and sinks without a jerk.
function smooth01(x) { const c = Math.max(0, Math.min(1, x)); return c * c * (3 - 2 * c); }
// The sun (levels 1 and the ground floor of level 2) or the moon (upstairs in level 2): it rises from behind the
// walls, waves hello, and sinks back out of sight. The wall tops hide it while it is low.
function drawSunOrMoon() {
  if (levelNo === 3 || levelNo === 4) return;
  const moon = levelNo === 2 && floorIdx === 1, P = 40, ph = (t + 3) % P;
  // up: rises (0 to 2.5 s), holds up (2.5 to 8 s), sinks back (8 to 10.5 s), then out of sight
  const up = ph < 2.5 ? smooth01(ph / 2.5) : ph < 8 ? 1 : ph < 10.5 ? smooth01((10.5 - ph) / 2.5) : 0;
  const wave = smooth01((ph - 2.3) / .6) * smooth01((4.9 - ph) / .1);       // the right hand waves; it stops abruptly at the end
  const lick = smooth01((ph - 5.0) / .5) * smooth01((7.4 - ph) / .5);       // the left hand brings the cone up to lick it
  const bearing = norm(1.0 - player.a);
  if (Math.abs(bearing) > 1.4 || up <= .001) return;
  const cx = W / 2 + Math.tan(bearing) * FOCAL, cy = H / 2 + 70 + (-220) * up, R = moon ? 30 : 36;
  const L = ctx, body = moon ? '#f4f1de' : '#ffd24a', bodyD = moon ? '#d8d4b8' : '#e0a52a';
  const hand = moon ? '#f4f1de' : '#ffd24a';
  L.save();
  if (!moon) {                                                            // rays turning slowly
    L.strokeStyle = '#ffd24a'; L.lineWidth = 3; L.lineCap = 'round';

// Realistic mountain ranges along the horizon. Each range is a ridge line that is worked out from the bearing of every
// column of the screen, so the ranges sit in the world and slide sideways as you turn. Snow sits on the high peaks.
function ridgeHeight(a, seed) {                                  // 0 to 1: a rough skyline built from a few wave lengths
  return Math.max(0, Math.min(1, .5 + .32 * Math.sin(a * 1.7 + seed) + .18 * Math.sin(a * 3.9 + seed * 2.3) + .08 * Math.sin(a * 8.1 + seed * .7)));
}
function drawMountainRange(seed, peakPx, color, snowColor, snowLine) {
  const base = H / 2 + 6;
  ctx.beginPath(); ctx.moveTo(0, base);
  for (let x = 0; x <= W; x += 4) {
    const a = player.a + Math.atan((x - W / 2) / FOCAL);
    ctx.lineTo(x, base - ridgeHeight(a, seed) * peakPx);
  }
  ctx.lineTo(W, base); ctx.closePath();

  if (snowColor) {                                              // snow caps: the silhouette above a snow line
    ctx.save(); ctx.clip();
    ctx.fillStyle = snowColor; ctx.fillRect(0, base - peakPx, W, peakPx * (1 - snowLine));
    ctx.restore();
  }
}
function drawMountains() {
  drawMountainRange(1.3, 120, '#a99bd0', null, 0);                     // far range, hazy
  drawMountainRange(4.1, 170, '#7566b0', '#f1ebff', .72);                // nearer range, snow on its peaks
  drawMountainRange(9.0, 70, '#4b3f88', null, 0);                        // foothills in front
}

    } else {
      const r = FOCAL / pr.perp * .1;
      const cy = H / 2 + FOCAL * (EYE - .28) / pr.perp - r;
      const glow = ctx.createRadialGradient(pr.sx, cy, 0, pr.sx, cy, r * 3);
      glow.addColorStop(0, 'rgba(255,230,120,.7)'); glow.addColorStop(1, 'rgba(255,230,120,0)');
      withColumnClip(pr.sx, r * 3, pr.perp, zbuf, () => {
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(pr.sx, cy, r * 3, 0, 7); ctx.fill();
        ctx.save(); ctx.translate(pr.sx, cy); ctx.rotate(t * 2 + it.s.x);
        (levelNo === 3 ? drawWrappedPeppermint : drawCandy)(0, 0, r); ctx.restore();
      }, cy - 3 * r);
    }
  }

  // fixed gun and crosshair
  ctx.translate(0, -pitch);
  const cine = state === 'bossintro';
  if (!cine) drawGun();
  drawParticles();

  ctx.strokeStyle = cine ? 'rgba(255,255,255,0)' : 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 9, H / 2); ctx.lineTo(W / 2 - 3, H / 2);
  ctx.moveTo(W / 2 + 3, H / 2); ctx.lineTo(W / 2 + 9, H / 2);
  ctx.moveTo(W / 2, H / 2 - 9); ctx.lineTo(W / 2, H / 2 - 3);
  ctx.moveTo(W / 2, H / 2 + 3); ctx.lineTo(W / 2, H / 2 + 9);
  ctx.stroke();

  // gift flash
  if (flash > 0) { ctx.fillStyle = `rgba(255,143,177,${flash * .35})`; ctx.fillRect(0, 0, W, H); }
  if (hurtT > 0) { ctx.fillStyle = `rgba(255,40,70,${hurtT * .55})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'win') {
    ctx.fillStyle = 'rgba(40,20,60,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    const pulse = 1 + Math.sin(winT * 4) * .04;
    ctx.save(); ctx.translate(W / 2, H / 2 - 20); ctx.scale(pulse, pulse);
    ctx.font = '900 38px "Press Start 2P", monospace'; ctx.lineWidth = 10; ctx.strokeStyle = '#2b1040';
    ctx.strokeText('THE END', 0, 0);
    ctx.fillStyle = '#ffd166'; ctx.fillText('THE END', 0, 0);
    ctx.restore();
    ctx.font = '700 13px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('Welcome to paradise. Press R to play again.', W / 2, H / 2 + 40);
  }
  if (state === 'lose') {
    const loseWord = levelNo === 3 ? "RAINBOW'D!" : levelNo === 4 ? 'TUMMYACHE!' : 'TOO CLOSE!';
    ctx.fillStyle = 'rgba(60,0,20,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = '900 34px "Press Start 2P", monospace'; ctx.lineWidth = 10; ctx.strokeStyle = '#2b1040';
    ctx.strokeText(loseWord, W / 2, H / 2 - 20);
    ctx.fillStyle = '#ff6b9a'; ctx.fillText(loseWord, W / 2, H / 2 - 20);
    ctx.font = '700 13px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText((loseMsg ? loseMsg + ' ' : '') + (levelNo === 4 ? 'Press R to Restart Bot Battle.' : 'Press R to retry Level ' + levelNo + '.'), W / 2, H / 2 + 30);
  }
  ctx.restore();
}

function drawPalm(x, base, s) {
  const tx = x + 6 * s, ty = base - 220 * s;
  ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 10 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x + 18 * s, base - 120 * s, tx, ty); ctx.stroke();
  ctx.strokeStyle = '#2e9e4a'; ctx.lineWidth = 8 * s;
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * .45 + Math.sin(t * 1.5 + i) * .05;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(a) * 60 * s, ty + Math.sin(a) * 60 * s - 20 * s, tx + Math.cos(a) * 100 * s, ty + Math.sin(a) * 100 * s + 20 * s);
    ctx.stroke();
  }
}

function drawLevelCard(T, txt) {                     // a title card at the start of a level
  const a = Math.min(1, T / .4, (3.2 - T) / .5);
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a * .72; ctx.fillStyle = '#2b1040'; ctx.fillRect(0, H * .36, W, H * .28);
  ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.font = '900 19px "Press Start 2P", monospace';
  ctx.lineWidth = 8; ctx.strokeStyle = '#2b1040'; ctx.strokeText(txt, W / 2, H / 2 + 11);
  ctx.fillStyle = '#ffd166'; ctx.fillText(txt, W / 2, H / 2 + 11);
  ctx.restore();
}

function drawBeachScene() {
  const horizon = H * .55, shore = H * .8;
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#4fc3ff'); sky.addColorStop(1, '#bfeaff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon);
  // sun
  const sx = W * .72, sy = H * .22 + Math.sin(t * .3) * 4;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 90);
  sg.addColorStop(0, 'rgba(255,250,200,1)'); sg.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 90, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 7); ctx.fill();
  // drifting clouds
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 230 + t * 14) % (W + 200)) - 100, cy = 60 + (i % 2) * 40;
    ctx.beginPath(); ctx.arc(cx, cy, 26, 0, 7); ctx.arc(cx + 28, cy - 8, 20, 0, 7); ctx.arc(cx + 54, cy, 24, 0, 7); ctx.fill();
  }
  // sea
  const sea = ctx.createLinearGradient(0, horizon, 0, shore);
  sea.addColorStop(0, '#2fb8e6'); sea.addColorStop(1, '#0a6fb0');
  ctx.fillStyle = sea; ctx.fillRect(0, horizon, W, shore - horizon);
  // sparkles on the water
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 30; i++) {
    const x = (i * 53 + t * 40) % W, y = horizon + 6 + (i * 17) % (shore - horizon - 12);
    ctx.fillRect(x, y, 6, 2);
  }
  // rolling waves
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
  for (let r = 0; r < 4; r++) {
    const y = horizon + 14 + r * 22;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin(x * .03 + t * 2 + r) * 4);
    ctx.stroke();
  }
  // sand
  const sand = ctx.createLinearGradient(0, shore, 0, H);
  sand.addColorStop(0, '#ffe9b0'); sand.addColorStop(1, '#f5cf85');
  ctx.fillStyle = sand; ctx.fillRect(0, shore, W, H - shore);
  // foam at the shoreline
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 5;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, shore - 4 + Math.sin(x * .02 + t * 3) * 6);
  ctx.stroke();
  drawPlayerBack(W / 2, H * .9, 14);
  // palm trees
  drawPalm(W * .12, H * .9, 1);
  drawPalm(W * .9, H * .95, 1.2);
}

function drawEnding() {
  drawBeachScene();
  // seagulls
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const gx = ((i * 200 + t * 30) % (W + 100)) - 50, gy = 90 + i * 25 + Math.sin(t + i) * 6;
    ctx.beginPath();
    ctx.moveTo(gx - 8, gy - 4); ctx.quadraticCurveTo(gx - 4, gy - 8, gx, gy);
    ctx.quadraticCurveTo(gx + 4, gy - 8, gx + 8, gy - 4);
    ctx.stroke();
  }
  // fade in from white, then fade out to the title card
  const fadeIn = Math.max(0, 1 - (asT - 2) / 1.5);
  if (fadeIn > 0) { ctx.fillStyle = `rgba(255,255,255,${fadeIn})`; ctx.fillRect(0, 0, W, H); }
  if (endFadeT >= 0) { ctx.globalAlpha = 1; ctx.fillStyle = `rgba(255,255,255,${Math.min(1, endFadeT / 2.4)})`; ctx.fillRect(0, 0, W, H); }
  if (asT > 3.5) {                                             // the beach stays on screen until the player presses a key
    ctx.globalAlpha = Math.min(1, (asT - 3.5) / 1.5);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c2410c'; ctx.font = '900 43px "Press Start 2P", monospace';
    ctx.fillText('THE END', W / 2, 70);
    ctx.font = '600 13px "Press Start 2P", monospace'; ctx.fillStyle = '#7a4a22';
    ctx.fillText('Welcome to paradise.', W / 2, 110);
    ctx.fillText('Press any key to return to title screen.', W / 2, H - 30);
    ctx.globalAlpha = 1;
  }
}

function drawManor(cx, base, k) {
  ctx.save();
  ctx.translate(cx, base); ctx.scale(k, k);
  const w = 360, h1 = 120, h2 = 120;
  ctx.fillStyle = '#ffb3d1'; ctx.fillRect(-w / 2, -h1 - h2, w, h1 + h2);
  ctx.fillStyle = '#ff8fb1'; ctx.fillRect(-w / 2, -h1 - 6, w, 12);
  ctx.fillStyle = '#c39bff';
  ctx.beginPath(); ctx.moveTo(-w / 2 - 20, -h1 - h2); ctx.lineTo(0, -h1 - h2 - 90); ctx.lineTo(w / 2 + 20, -h1 - h2); ctx.closePath(); ctx.fill();
  for (let f = 0; f < 2; f++) {
    for (let i = 0; i < 4; i++) {
      if (f === 0 && (i === 1 || i === 2)) continue;
      const wx = -w / 2 + 28 + i * 86, wy = -h1 - h2 + 20 + f * h1;
      ctx.fillStyle = '#fff3a0'; ctx.fillRect(wx, wy, 44, 60);
      ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 4; ctx.strokeRect(wx, wy, 44, 60);
      ctx.beginPath(); ctx.moveTo(wx + 22, wy); ctx.lineTo(wx + 22, wy + 60); ctx.moveTo(wx, wy + 30); ctx.lineTo(wx + 44, wy + 30); ctx.stroke();
    }
  }
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(-34, -90, 68, 90);
  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(20, -45, 5, 0, 7); ctx.fill();
  ctx.restore();
}

function drawTransition() {
  // a first-person walk down a tunnel of candy-colored rings toward a glowing manor
  ctx.fillStyle = '#1a0f2a'; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 260);
  glow.addColorStop(0, `rgba(255,243,170,${.55 + Math.min(.4, asT * .05)})`); glow.addColorStop(1, 'rgba(255,243,170,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const q = levelNo === 1, N = 14, base = q ? 1.8 : 1.1, SLOW0 = q ? 1.6 : 5, speed = asT < SLOW0 ? base : Math.max(.15, base - (asT - SLOW0) * .5);   // the first transition is quick
  for (let i = N - 1; i >= 0; i--) {
    const z = ((i + t * speed * 3) % N) / N;
    const sz = Math.pow(z, 3) * 1.6 + .02;
    const rw = W * sz, rh = H * sz;
    ctx.strokeStyle = PAL[i % 6];
    ctx.globalAlpha = Math.min(1, z * 2.2);
    ctx.lineWidth = Math.max(1, 14 * sz);
    ctx.beginPath(); ctx.roundRect(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, 24 * sz); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // the manor comes into view at the end of the tunnel
  const MAN0 = q ? 1.0 : 4.5, MANT = q ? 1.2 : 3;
  if (asT > MAN0) {
    const k = Math.min(1, (asT - MAN0) / MANT);
    ctx.globalAlpha = Math.min(1, (asT - MAN0) / (MANT / 2));
    if (levelNo === 2) drawBearShadow(W / 2, H * .5 + 190 * k * .5, (.15 + k * .85) * .85);
    else drawManor(W / 2, H * .5 + 190 * k * .5, .15 + k * .85);
    ctx.globalAlpha = 1;
  }
  // fade in from white
  const fadeIn = Math.max(0, 1 - (asT - (q ? .5 : 2)) / (q ? .4 : 1.2));
  if (fadeIn > 0) { ctx.fillStyle = `rgba(255,255,255,${fadeIn})`; ctx.fillRect(0, 0, W, H); }
  // fade to white as the next level begins
  const OUT0 = q ? 1.9 : 7.3, OUTT = q ? .7 : 1.2;
  if (asT > OUT0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, (asT - OUT0) / OUTT)})`; ctx.fillRect(0, 0, W, H); }
}

function drawPeppermintDisc(x, y, rx, ry) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill();
  for (let i = 0; i < 6; i += 2) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.ellipse(x, y, rx, ry, 0, i * Math.PI / 3, (i + 1) * Math.PI / 3); ctx.closePath();
    ctx.fillStyle = '#ff3d5a'; ctx.fill();
  }
  ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.stroke();
}

function drawTitleArt() {
  const X0 = W * .7, base = H * .93;
  // a mound of peppermints
  for (const [n, up] of [[7, 0], [5, 18], [4, 36], [2, 54]]) for (let i = 0; i < n; i++) drawPeppermintDisc(X0 + (i - (n - 1) / 2) * 42, base - up, 22, 9);
  const fx = X0, fy = base - 62;   // the feet, standing on top of the mound
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  // legs
  ctx.fillStyle = '#3b4f9e';
  for (const dx of [-16, 3]) { ctx.beginPath(); ctx.roundRect(fx + dx, fy - 46, 13, 46, 5); ctx.fill(); ctx.stroke(); }
  // body
  ctx.fillStyle = '#ff8fb1'; ctx.beginPath(); ctx.roundRect(fx - 22, fy - 100, 44, 58, 10); ctx.fill(); ctx.stroke();
  // the free arm
  ctx.fillStyle = '#f3c9a0'; ctx.beginPath(); ctx.roundRect(fx - 32, fy - 96, 11, 42, 5); ctx.fill(); ctx.stroke();
  // head and hair
  ctx.fillStyle = '#f3c9a0'; ctx.beginPath(); ctx.arc(fx, fy - 118, 19, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3a6e'; ctx.beginPath(); ctx.arc(fx, fy - 122, 19, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(fx - 7, fy - 117, 2.5, 0, 7); ctx.arc(fx + 7, fy - 117, 2.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(fx, fy - 111, 7, .2, Math.PI - .2); ctx.stroke();
  // the banner arm, raised, and the pole
  ctx.lineWidth = 12; ctx.strokeStyle = '#f3c9a0'; ctx.beginPath(); ctx.moveTo(fx + 18, fy - 92); ctx.lineTo(fx + 34, fy - 196); ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = '#7a4a22'; ctx.beginPath(); ctx.moveTo(fx + 34, fy - 196); ctx.lineTo(fx + 34, fy - 330); ctx.stroke();
  // the banner, with a swallowtail
  const bx = fx + 34, by = fy - 330;
  ctx.fillStyle = '#ffd166'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 120, by); ctx.lineTo(bx + 120, by + 80); ctx.lineTo(bx + 60, by + 64); ctx.lineTo(bx, by + 80); ctx.closePath(); ctx.fill(); ctx.stroke();
  // the lollipop on the banner
  const lx = bx + 60, ly = by + 32;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.fillRect(lx - 3, ly + 20, 6, 26); ctx.strokeRect(lx - 3, ly + 20, 6, 26);
  for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(lx, ly, 22 - k * 5, 0, 7); ctx.strokeStyle = PAL[k % 6]; ctx.lineWidth = 5; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(lx, ly, 24, 0, 7); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawKeyMap(cy) {                            // keycaps with what each one does
  const keys = [['\u2190 \u2192', 'turn'], ['W', 'forward'], ['S', 'back'], ['A', 'strafe left'], ['D', 'strafe right'], ['Space', 'hand out candy'], ['Click', 'fire'], ['Esc', 'free the mouse']];
  const cw = 94;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  keys.forEach(([k, act], i) => {
    const cx = W / 2 + (i - (keys.length - 1) / 2) * cw;
    ctx.font = '900 10px "Press Start 2P", monospace';
    const w = Math.max(46, ctx.measureText(k).width + 18), h = 36, x = cx - w / 2, y = cy - h / 2;
    ctx.lineWidth = 3; ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.roundRect(x, y + 4, w, h, 8); ctx.fillStyle = '#c9a27a'; ctx.fill(); ctx.stroke();      // the keycap's base
    ctx.beginPath(); ctx.roundRect(x, y, w, h - 4, 8); ctx.fillStyle = '#fff3e0'; ctx.fill(); ctx.stroke();      // the keycap's top
    ctx.fillStyle = INK; ctx.fillText(k, cx, y + (h - 4) / 2);
    ctx.font = '600 8px "Press Start 2P", monospace'; ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(20,10,40,.9)'; ctx.shadowBlur = 4;
    ctx.fillText(act, cx, cy + 34); ctx.shadowBlur = 0;
  });
  ctx.textBaseline = 'alphabetic';
}

function drawTitleBackground() {
  if (!TITLE_IMG.complete || !TITLE_IMG.naturalWidth) { drawBeachScene(); return; }
  const sc = Math.max(W / TITLE_IMG.naturalWidth, H / TITLE_IMG.naturalHeight);
  const iw = TITLE_IMG.naturalWidth * sc, ih = TITLE_IMG.naturalHeight * sc;
  ctx.drawImage(TITLE_IMG, (W - iw) / 2, (H - ih) / 2, iw, ih);
}

let titlePage = 0;   // the title screen: 0 is the title, 1 is the controls

function drawTitle() {
  drawTitleBackground();
  ctx.fillStyle = 'rgba(20,10,40,.4)'; ctx.fillRect(0, H * .3, W, H * .62);   // a soft band behind the words
  ctx.textAlign = 'center';
  if (titlePage === 0) {
    ctx.font = '900 58px "Press Start 2P", monospace'; ctx.lineWidth = 12; ctx.strokeStyle = '#2b1040';
    ctx.strokeText('MOOD', W / 2, H / 2 - 30);
    ctx.fillStyle = '#ffd166'; ctx.fillText('MOOD', W / 2, H / 2 - 30);
    ctx.font = '600 12px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('Hand out sweets. Cheer up the sad. Save the day.', W / 2, H / 2 + 14);
    if (Math.sin(t * 4) > -.2) { ctx.font = '800 13px "Press Start 2P", monospace'; ctx.fillStyle = '#fff'; ctx.fillText('PRESS ANY KEY', W / 2, H / 2 + 80); }
    ctx.font = '600 9px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('Press B for Bot Battle (you against the bots)', W / 2, H / 2 + 144);
  } else {
    ctx.font = '900 36px "Press Start 2P", monospace'; ctx.lineWidth = 9; ctx.strokeStyle = '#2b1040';
    ctx.strokeText('CONTROLS', W / 2, H / 2 - 60);
    ctx.fillStyle = '#ffd166'; ctx.fillText('CONTROLS', W / 2, H / 2 - 60);
    ctx.font = '600 10px "Press Start 2P", monospace';
    drawKeyMap(H / 2 + 10);
    ctx.font = '600 9px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('Click the screen to capture the mouse \u00b7 Mouse looks around', W / 2, H / 2 + 100);
    if (Math.sin(t * 4) > -.2) { ctx.font = '800 13px "Press Start 2P", monospace'; ctx.fillStyle = '#fff'; ctx.fillText('PRESS ANY KEY TO START', W / 2, H / 2 + 150); }
  }
  ctx.font = '600 10px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
}

function drawMini() {
  const S = 120 / MAP.length;
  mctx.fillStyle = 'rgba(20,10,30,.9)'; mctx.fillRect(0, 0, 120, 120);
  for (let y = 0; y < MAP.length; y++) for (let x = 0; x < MAP.length; x++) {
    if (MAP[y][x] === '1') { mctx.fillStyle = PAL[(x + y) % 6]; mctx.globalAlpha = .75; mctx.fillRect(x * S, y * S, S, S); }
  }
  mctx.globalAlpha = 1;
  for (const p of pickups) if (p.alive) { mctx.fillStyle = '#fff3a0'; mctx.beginPath(); mctx.arc(p.x * S, p.y * S, 2.5, 0, 7); mctx.fill(); }
  for (const s of sprites) { mctx.fillStyle = s.happy ? '#ff6b9a' : '#6bd4ff'; mctx.beginPath(); mctx.arc(s.x * S, s.y * S, 3.5, 0, 7); mctx.fill(); }
  if (keyItem && keyItem.alive && keyItem.floor === floorIdx) {   // the gold key, once it has dropped
    const kx = keyItem.x * S, ky = keyItem.y * S;
    mctx.fillStyle = '#ffd700'; mctx.strokeStyle = '#7a5a00'; mctx.lineWidth = 1;
    mctx.beginPath(); mctx.moveTo(kx, ky - 5); mctx.lineTo(kx + 5, ky); mctx.lineTo(kx, ky + 5); mctx.lineTo(kx - 5, ky); mctx.closePath(); mctx.fill(); mctx.stroke();
  }
  const px = player.x * S, py = player.y * S;
  mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.moveTo(px, py); mctx.lineTo(px + Math.cos(player.a) * 10, py + Math.sin(player.a) * 10); mctx.stroke();
  mctx.fillStyle = '#fff'; mctx.beginPath(); mctx.arc(px, py, 3, 0, 7); mctx.fill();
}

let faceLevel = -1, faceKey = '', levelCardAt = -99;
function drawBearFace(stage) {                       // the bear's head for the status bar: 0 calm, rising to 3 furious
  const c = fc, u = 6;
  c.clearRect(0, 0, 56, 56);
  const bg = c.createLinearGradient(0, 0, 0, 56);
  bg.addColorStop(0, '#5a3c7a'); bg.addColorStop(1, '#2c1b3d');
  c.fillStyle = bg; c.fillRect(0, 0, 56, 56);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const fur = '#b0743c', furD = '#7d4e24', belly = '#f0cf9e', bellyD = '#c99a62';
  for (const sd of [-1, 1]) {                                                    // ears
    cel(u, () => c.arc(28 + sd * 15, 15, 6.5, 0, 7), fur, furD, c);
    cel(u, () => c.arc(28 + sd * 15, 15, 3.4, 0, 7), belly, bellyD, c);
  }
  cel(u, () => c.arc(28, 31, 17, 0, 7), fur, furD, c);                          // head
  cel(u, () => c.ellipse(28, 38, 8, 6, 0, 0, 7), belly, bellyD, c);             // muzzle
  c.fillStyle = '#2a1a22'; c.beginPath(); c.ellipse(28, 35, 3, 2, 0, 0, 7); c.fill();   // nose
  c.strokeStyle = INK; c.lineWidth = 1.8;
  for (const sd of [-1, 1]) {
    const ex = 28 + sd * 7, ey = 27;
    c.fillStyle = stage === 2 ? '#ff3b3b' : INK; c.beginPath(); c.arc(ex, ey, stage === 0 ? 2.4 : 2.9, 0, 7); c.fill();
    // the brows: lower on the inside as he gets angrier
    if (stage === 4) { c.beginPath(); c.moveTo(28 + sd * 3.5, ey - 4.6); c.quadraticCurveTo(28 + sd * 6, ey - 8.4, 28 + sd * 8.5, ey - 5); c.stroke(); }   // soft, arched brows
    else { c.beginPath(); c.moveTo(28 + sd * 3.5, ey - 4 + Math.min(stage, 3) * 1.1); c.lineTo(28 + sd * 8.5, ey - 4 - Math.min(stage, 3) * .4); c.stroke(); }
  }
  c.beginPath();                                                                 // the mouth
  if (stage === 0) c.arc(28, 42, 4, .2, Math.PI - .2);
  else if (stage === 1) { c.moveTo(24, 44); c.lineTo(32, 44); }
  else if (stage === 2) c.arc(28, 48, 4, Math.PI + .4, 2 * Math.PI - .4);

  c.stroke();
  if (stage === 4) {                                                             // a big, clear smile
    c.fillStyle = '#2a1a22'; c.beginPath(); c.moveTo(20, 38); c.quadraticCurveTo(28, 52, 36, 38); c.quadraticCurveTo(28, 42, 20, 38); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff8fb1'; c.beginPath(); c.ellipse(28, 46.5, 3.2, 1.6, 0, 0, 7); c.fill();   // a little tongue
  }
  if (stage === 3) {                                                             // bared teeth: a snarl, pulled back from the muzzle
    c.fillStyle = '#2a1a22'; c.beginPath(); c.roundRect(21, 40, 14, 9, 3); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath();
    for (let i = 0; i < 4; i++) { const x = 22.5 + i * 3.3; c.moveTo(x, 40); c.lineTo(x + 1.5, 44.5); c.lineTo(x + 3, 40); }   // upper teeth
    for (let i = 0; i < 4; i++) { const x = 22.5 + i * 3.3; c.moveTo(x, 49); c.lineTo(x + 1.5, 44.5); c.lineTo(x + 3, 49); }   // lower teeth
    c.fill(); c.stroke();
  }
}

function drawFace(level) {                                 // the HUD portrait, in the same cel style
  const c = fc, u = 6;
  c.clearRect(0, 0, 56, 56);
  const bg = c.createLinearGradient(0, 0, 0, 56);
  bg.addColorStop(0, '#5a3c7a'); bg.addColorStop(1, '#2c1b3d');
  c.fillStyle = bg; c.fillRect(0, 0, 56, 56);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const skin = level === 0 ? '#c4d4e6' : '#ffd9a8';
  cel(u, () => c.roundRect(9, 12, 38, 34, 14), '#7b5cd6', '#5a3fa8', c);
  cel(u, () => c.arc(28, 32, 16.5, 0, 7), skin, dk(skin, .3), c);
  cel(u, () => {
    c.moveTo(11.5, 30.5); c.arc(28, 32, 17, Math.PI * .95, Math.PI * 2.05); c.lineTo(45, 30);
    c.quadraticCurveTo(37, 16, 27, 23); c.quadraticCurveTo(18, 27, 11.5, 30.5); c.closePath();
  }, '#7b5cd6', '#5a3fa8', c);
  c.strokeStyle = INK; c.lineWidth = 1.7;
  if (level === 2) {
    for (const sd of [-1, 1]) { c.beginPath(); c.arc(28 + sd * 7, 33, 3.6, Math.PI * 1.05, Math.PI * 1.95); c.stroke(); }
    cel(u, () => c.ellipse(28, 40, 6, 5.5, 0, 0, Math.PI), '#7a2a4a', null, c);
    c.fillStyle = 'rgba(255,120,150,.6)'; c.beginPath(); c.ellipse(15.5, 38, 3, 2, 0, 0, 7); c.ellipse(40.5, 38, 3, 2, 0, 0, 7); c.fill();
  } else {
    for (const sd of [-1, 1]) {
      const ex = 28 + sd * 7;
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, 33, 4.2, 5, 0, 0, 7); c.fill(); c.lineWidth = 1.3; c.stroke();
      c.fillStyle = '#3a2a5a'; c.beginPath(); c.arc(ex, 34, 2.9, 0, 7); c.fill();
      c.fillStyle = INK; c.beginPath(); c.arc(ex, 34.2, 1.5, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - 1.2, 32.4, 1.1, 0, 7); c.fill();
    }
    c.lineWidth = 1.7;
    if (level === 0) {
      for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(28 + sd * 10, 26); c.lineTo(28 + sd * 4, 28.5); c.stroke(); }
      c.beginPath(); c.arc(28, 47, 6, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
      c.fillStyle = '#7fd1ff'; c.beginPath(); c.arc(38, 38, 2.2, 0, 7); c.fill(); c.lineWidth = 1; c.stroke();
    } else { c.beginPath(); c.moveTo(23, 42); c.lineTo(33, 42); c.stroke(); }
  }
}

function updateHUD() {
  const lvl3 = levelNo === 3 && boss, lvl4 = levelNo === 4;
  const f = NPC_COUNT ? happyCount / NPC_COUNT : 0;
  document.getElementById('fill').style.width = ((lvl3 ? boss.hp / boss.max : lvl4 ? player.hp / TUNING.playerHearts : f) * 100) + '%';
  document.getElementById('hap').textContent = lvl4 ? `Bots down ${botsDown}` : lvl3
    ? `Giant Teddy ${Math.max(0, boss.hp)}/${boss.max}`
    : `Joy ${happyCount}/${NPC_COUNT}` + (levelNo === 2 ? (floorIdx ? '  \u00b7  Second floor' : '  \u00b7  Ground floor') : '');
  document.getElementById('cnd').textContent = ((lvl3 || lvl4) ? '\u2665'.repeat(Math.max(0, player.hp)) + '  ' : '') + `\u{1F36C} ${candies}`;
  // the portrait: the bear's head on the final level, getting angrier as his health drops; otherwise the player's face
  const bearStage = boss ? (boss.hp <= 0 ? 4 : boss.hp / boss.max > .75 ? 0 : boss.hp / boss.max > .5 ? 1 : boss.hp / boss.max > .25 ? 2 : 3) : 0;
  const level = lvl3 ? bearStage : (f < .34 ? 0 : f < .67 ? 1 : 2);
  const fk = (lvl3 ? 'bear' : 'npc') + level;
  if (fk !== faceKey) { faceKey = fk; if (lvl3) drawBearFace(level); else drawFace(level); }
  document.getElementById('inv').style.display = lvl3 ? 'none' : 'block';
  // no minimap on the title screen or during cinematics (level transitions, endings, the stair climb)
  document.getElementById('bar').style.display = (state === 'title' || (state === 'ascend' && levelNo === 3)) ? 'none' : '';   // the status bar stays off the title and ending screens
  document.getElementById('mini').style.display = (state === 'title' || state === 'ascend' || state === 'climb' || state === 'intro' || state === 'bossintro') ? 'none' : 'block';
  const k = hasKey ? 1 : 0;
  if (k !== invLast) { invLast = k; drawInv(); }
  const toast = document.getElementById('toast');
  toast.textContent = msgT > 0 ? msgText : '';
  toast.style.opacity = msgT > 0 ? (msgFlash ? (Math.floor(t * 6) % 2 ? 1 : .15) : 1) : 0;   // a flashing message blinks on and off
  toast.style.color = msgFlash && msgT > 0 ? '#ffd166' : '';
  // a black copy of the letters, offset in every direction, sits beneath the yellow ones as an outline
  toast.style.textShadow = msgFlash && msgT > 0 ? '2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000' : '';
}

// ---------- logic ----------
// Produced-sound music: warm pads, FM electric piano, plucks, sub bass and soft drums, sent through
// a compressor, convolution reverb and a tempo-synced delay, with a sidechain-style duck on the kick.
// Each level has its own 8-bar piece, and the arrangement fills out as more people are cheered up.
let musicOn = false, nextT = 0, mStep = 0, M = null, songLevel = 0, SONG = null, STEP = .16, noiseBuf = null;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PENT = [0, 2, 4, 7, 9];
const PROGS = {
  1: { bpm: 92, chords: [   // C major, bright and open
    { r: 36, t: [60, 64, 67, 71, 74] }, { r: 33, t: [57, 60, 64, 67, 71] },
    { r: 41, t: [53, 57, 60, 64, 67] }, { r: 43, t: [55, 59, 62, 64, 69] },
    { r: 36, t: [60, 64, 67, 71, 74] }, { r: 40, t: [55, 59, 62, 64] },
    { r: 41, t: [53, 57, 60, 64, 67] }, { r: 43, t: [55, 60, 62, 65] }] },
  2: { bpm: 84, chords: [   // A minor, a little more mysterious
    { r: 33, t: [57, 60, 64, 67, 71] }, { r: 41, t: [53, 57, 60, 64] },
    { r: 36, t: [55, 60, 64, 67, 71] }, { r: 43, t: [55, 59, 62, 64] },
    { r: 33, t: [57, 60, 64, 67, 71] }, { r: 38, t: [57, 60, 62, 64, 65] },
    { r: 41, t: [53, 57, 60, 64] }, { r: 40, t: [59, 62, 64, 69] }] }
};

PROGS[3] = { bpm: 118, pent: [0, 2, 5, 7, 9], chords: [   // D minor, driving boss theme
  { r: 38, t: [57, 62, 65, 69, 72] }, { r: 34, t: [58, 62, 65, 70] },
  { r: 43, t: [55, 58, 62, 65] }, { r: 33, t: [57, 61, 64, 67] },
  { r: 38, t: [57, 62, 65, 69, 72] }, { r: 41, t: [57, 60, 65, 69] },
  { r: 34, t: [58, 62, 65, 70] }, { r: 33, t: [57, 62, 64, 69] }] };

function buildSong(level) {
  const P = PROGS[level] || PROGS[1];
  STEP = 60 / P.bpm / 4;
  if (M) M.del.delayTime.value = 60 / P.bpm * .75;
  let seed = level * 7919 + 13;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const scale = [];
  for (let m = 67; m <= 88; m++) if ((P.pent || PENT).includes(m % 12)) scale.push(m);
  const rhythms = [[0, 3, 6, 8, 11, 14], [0, 2, 6, 8, 12], [0, 4, 6, 10, 12, 14], [0, 3, 8, 10, 14], [0, 6, 8, 11, 13]];
  const melody = [];
  let idx = 4;
  const writeBar = b => {
    const pcs = P.chords[b].t.map(m => m % 12);
    const rh = rhythms[Math.floor(rnd() * rhythms.length)];
    return rh.map((st, k) => {
      let stp = [-2, -1, -1, 0, 1, 1, 2][Math.floor(rnd() * 7)];
      if (idx <= 2 && stp < 0) stp = -stp;                       // bounce off the bottom of the range
      if (idx >= scale.length - 3 && stp > 0) stp = -stp;        // and off the top
      if (stp === 0 && rnd() < .6) stp = rnd() < .5 ? 1 : -1;    // fewer repeated notes
      idx = Math.max(1, Math.min(scale.length - 2, idx + stp));
      if (st % 8 === 0 || (k === rh.length - 1 && (b === 3 || b === 7))) {   // land on chord tones
        let best = idx, bd = 99;
        for (let j = Math.max(0, idx - 3); j <= Math.min(scale.length - 1, idx + 3); j++)
          if (pcs.includes(scale[j] % 12) && Math.abs(j - idx) < bd) { bd = Math.abs(j - idx); best = j; }
        idx = best;
      }
      const next = rh[k + 1] === undefined ? 16 : rh[k + 1];
      return { s: st, m: scale[idx], d: Math.min(next - st, 6) };
    });
  };
  for (let b = 0; b < 4; b++) melody[b] = writeBar(b);
  melody[4] = melody[0]; melody[5] = melody[1]; melody[6] = melody[2];   // restate the theme
  melody[7] = writeBar(7);                                               // new ending
  SONG = { chords: P.chords, melody };
  songLevel = level;
}

function initMusic() {
  if (M || !AC) return;
  const rate = AC.sampleRate, len = Math.floor(rate * 2.4);
  const ir = AC.createBuffer(2, len, rate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  noiseBuf = AC.createBuffer(1, rate, rate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < rate; i++) nd[i] = Math.random() * 2 - 1;

  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -20; comp.ratio.value = 3.5; comp.attack.value = .01; comp.release.value = .25;
  const master = AC.createGain();
  master.gain.setValueAtTime(.0001, AC.currentTime);
  master.gain.exponentialRampToValueAtTime(.9, AC.currentTime + 2.5);
  master.connect(comp); comp.connect(AC.destination);

  const dry = AC.createGain(), pad = AC.createGain();
  dry.connect(master); pad.connect(master);

  const conv = AC.createConvolver(); conv.buffer = ir;
  const revIn = AC.createGain(), revOut = AC.createGain(); revOut.gain.value = .42;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(master);

  const del = AC.createDelay(1); del.delayTime.value = 60 / PROGS[1].bpm * .75;
  const fb = AC.createGain(); fb.gain.value = .38;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const delIn = AC.createGain(), delOut = AC.createGain(); delOut.gain.value = .3;
  delIn.connect(del); del.connect(lp); lp.connect(fb); fb.connect(del);
  lp.connect(delOut); delOut.connect(master); delOut.connect(revIn);

  M = { dry, pad, revIn, delIn, del };
}

function route(node, o) {
  let n = node;
  if (o.pan && AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = o.pan; n.connect(p); n = p; }
  n.connect(o.pad ? M.pad : M.dry);
  if (o.rev) { const g = AC.createGain(); g.gain.value = o.rev; n.connect(g); g.connect(M.revIn); }
  if (o.del) { const g = AC.createGain(); g.gain.value = o.del; n.connect(g); g.connect(M.delIn); }
}

function padNote(f, time, dur, vol, cutoff) {
  const g = AC.createGain(), flt = AC.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = cutoff; flt.Q.value = .7;
  g.gain.setValueAtTime(.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + .6);
  g.gain.setValueAtTime(vol, time + dur);
  g.gain.exponentialRampToValueAtTime(.0001, time + dur + 1.4);
  [-9, 0, 9].forEach(det => {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
    o.connect(flt); o.start(time); o.stop(time + dur + 1.5);
  });
  flt.connect(g);
  route(g, { pad: true, rev: .55, pan: (Math.random() - .5) * .8 });
}

function bassNote(f, time, dur, vol) {
  const g = AC.createGain(), flt = AC.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = 420;
  g.gain.setValueAtTime(.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + .01);
  g.gain.exponentialRampToValueAtTime(vol * .6, time + .14);
  g.gain.setValueAtTime(vol * .6, time + dur);
  g.gain.exponentialRampToValueAtTime(.0001, time + dur + .12);
  ['sine', 'triangle'].forEach((type, i) => {
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f;
    const og = AC.createGain(); og.gain.value = i ? .35 : 1;
    o.connect(og); og.connect(flt); o.start(time); o.stop(time + dur + .2);
  });
  flt.connect(g);
  route(g, {});
}

function pluck(f, time, vol, pan) {
  const o = AC.createOscillator(), flt = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = f;
  flt.type = 'lowpass'; flt.Q.value = 3;
  flt.frequency.setValueAtTime(3200, time);
  flt.frequency.exponentialRampToValueAtTime(500, time + .22);
  g.gain.setValueAtTime(.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + .005);
  g.gain.exponentialRampToValueAtTime(.0001, time + .3);
  o.connect(flt); flt.connect(g); o.start(time); o.stop(time + .35);
  route(g, { rev: .3, del: .35, pan });
}

function ePiano(f, time, dur, vol, del) {
  const car = AC.createOscillator(), mod = AC.createOscillator(), mg = AC.createGain(), g = AC.createGain();
  car.type = 'sine'; mod.type = 'sine'; car.frequency.value = f; mod.frequency.value = f;
  mg.gain.setValueAtTime(f * 2.2, time);
  mg.gain.exponentialRampToValueAtTime(f * .15, time + .6);
  mod.connect(mg); mg.connect(car.frequency);
  const tine = AC.createOscillator(), tg = AC.createGain();
  tine.type = 'sine'; tine.frequency.value = f * 2;
  tg.gain.setValueAtTime(.22, time); tg.gain.exponentialRampToValueAtTime(.0001, time + .25);
  tine.connect(tg);
  const end = time + Math.max(dur, .6) + .5;
  g.gain.setValueAtTime(.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + .006);
  g.gain.exponentialRampToValueAtTime(vol * .3, time + .55);
  g.gain.exponentialRampToValueAtTime(.0001, end);
  car.connect(g); tg.connect(g);
  [car, mod, tine].forEach(o => { o.start(time); o.stop(end + .05); });
  route(g, { rev: .4, del: del || .4 });
}

function kick(time) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, time);
  o.frequency.exponentialRampToValueAtTime(46, time + .11);
  g.gain.setValueAtTime(.85, time);
  g.gain.exponentialRampToValueAtTime(.0001, time + .38);
  o.connect(g); o.start(time); o.stop(time + .4);
  route(g, {});
  M.pad.gain.cancelScheduledValues(time);   // duck the pads on every kick
  M.pad.gain.setValueAtTime(.55, time);
  M.pad.gain.linearRampToValueAtTime(1, time + .26);
}

function noiseHit(time, type, freq, vol, dur, rev, pan) {
  const src = AC.createBufferSource(), flt = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; flt.type = type; flt.frequency.value = freq; flt.Q.value = .8;
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(.0001, time + dur);
  src.connect(flt); flt.connect(g);
  src.start(time, Math.random() * .5); src.stop(time + dur + .05);
  route(g, { rev, pan });
}

function snare(time, vol) {
  noiseHit(time, 'bandpass', 1900, vol, .2, .3, 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(190, time);
  o.frequency.exponentialRampToValueAtTime(130, time + .1);
  g.gain.setValueAtTime(vol * .4, time);
  g.gain.exponentialRampToValueAtTime(.0001, time + .12);
  o.connect(g); o.start(time); o.stop(time + .15);
  route(g, { rev: .2 });
}

function hat(time, vol, open) {
  noiseHit(time, 'highpass', 7500, vol, open ? .22 : .045, .12, (Math.random() - .5) * .4);
}

function playStep(i, time) {
  const bar = Math.floor(i / 16) % 8, s = i % 16, ch = SONG.chords[bar];
  const p = levelNo === 3 && boss ? .5 + .5 * (1 - boss.hp / boss.max) : (NPC_COUNT ? happyCount / NPC_COUNT : 0);
  const T = time + (s % 2 ? STEP * .12 : 0);   // light swing on the off-sixteenths
  const barLen = STEP * 16;

  if (s === 0) {
    const cut = 650 + p * 1100;
    ch.t.forEach(m => padNote(mtof(m), time, barLen * .98, .0085, cut));
    if (p >= .75) padNote(mtof(ch.t[ch.t.length - 1] + 12), time, barLen * .98, .006, cut + 800);
  }

  const bassSteps = p >= .75 ? [0, 6, 10, 14] : p >= .5 ? [0, 6, 10] : [0, 8];
  if (bassSteps.includes(s)) bassNote(mtof(ch.r), T, STEP * (s === 0 ? 5 : 3), s === 0 ? .34 : .26);

  if (s % 2 === 0) {
    const seq = [0, 2, 1, 3, 2, 4, 3, 1];
    pluck(mtof(ch.t[seq[s / 2] % ch.t.length]), T, .03 + p * .012, (s / 2) % 2 ? .35 : -.35);
  }

  SONG.melody[bar].filter(n => n.s === s).forEach(n => {
    ePiano(mtof(n.m), T, STEP * n.d, .055 + p * .02, .4);
    if (p >= .75) ePiano(mtof(n.m + 12), T, STEP * n.d, .018, .5);
  });

  if (p >= .25) {
    if (s % 2 === 0) hat(T, s % 4 === 2 ? .045 : .03, false);
    if (p >= .75 && s % 2) hat(T, .018, false);
    if (s === 14 && bar % 2 === 1) hat(T, .05, true);
  }
  if (p >= .5) {
    if (s === 0 || s === 6 || s === 10) kick(time);
    if (s === 4 || s === 12) snare(T, .24);
    if (bar === 7 && p >= .75 && s >= 13) snare(T, .1 + (s - 13) * .04);
  }
}

function scheduleMusic() {
  if (state === 'title' || !AC) return;
  try {
    initMusic();
    if (songLevel !== levelNo) { buildSong(levelNo); mStep = 0; nextT = 0; }
    if (nextT < AC.currentTime) nextT = AC.currentTime + .05;
    while (nextT < AC.currentTime + .25) { playStep(mStep++, nextT); nextT += STEP; }
  } catch (e) { console.error('music', e); }
}
function startGame() { if (!musicOn) { musicOn = true; setInterval(scheduleMusic, 50); } if (state === 'title') state = 'play'; sfx([[523, .15, 'triangle'], [784, .25, 'triangle', .1]]); }
function reset() {
  resetWorld(); state = 'play'; winT = 0; faceLevel = -1; levelCardAt = t;
  if (levelNo === 2) startIntro();
  else if (levelNo === 3) { if (!bossIntroSeen) startBossIntro(); }
  else bossIntroSeen = false;
}

function buildArena() {
  const N = 17;
  const g = Array.from({ length: N }, (_, y) => Array.from({ length: N }, (_, x) => (x === 0 || y === 0 || x === N - 1 || y === N - 1) ? '1' : '0'));
